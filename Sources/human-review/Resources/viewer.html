<script>
'use strict';

const state = {
  blocks: [],            // [{start, text}]
  fileDir: '',           // directory of the source file; relative image paths resolve against it
  linkDefs: '',          // every [label]: target line in the file, appended to each block before parsing
  comments: [],          // flat list from Swift
  newComposerBlock: null,  // line of block where the user is composing a NEW thread
  replyComposerRoot: null, // root id of thread the user is replying to
  focusedBlock: null,
  focusedSidebarThread: null,  // root id of focused sidebar (scope=global) thread
  expandedSettled: new Set(),  // root ids of settled threads the user has expanded
  initialJumpDone: false,      // we auto-focus the first active thread on file open
  overlay: null,               // {path, fragment} when overlay is open
  sidebarReplyTo: null,        // root id of a global thread to reply to via the bottom composer
  pendingAttention: null,      // UUID requested by agent via `attention` — focus once, then clear
  attentionShown: new Set(),   // ids we've already focused (so we don't re-focus on every render)
  // Composer drafts — keyed by stable composer key (e.g. `new:<line>`,
  // `reply:<root>`, `sidebar`). Snapshotted before every render so that
  // an external sidecar reload (agent posts a comment, someone else types)
  // doesn't blow away the user's in-flight text or focus. Cleared on
  // submit / cancel.
  drafts: new Map(),           // key → { value, selStart, selEnd }
  search: null,                // { query, index, total } when ⌘F is open
  fileExt: '',                 // lowercase ext from Swift; '' for no extension
};

// ─── File-type routing ────────────────────────────────────────────────────
// Markdown files (.md / .markdown / unset) use the original marked.parse +
// mermaid pipeline, with blocks grouped by blank-line separation. Everything
// else (.py / .txt / .js / …) flips into GitHub-style per-line code review:
// one block per line, line-number gutter, syntax-highlighted via hljs.
const EXT_TO_HLJS_LANG = {
  py: 'python', pyi: 'python',
  js: 'javascript', mjs: 'javascript', cjs: 'javascript',
  ts: 'typescript', tsx: 'typescript', jsx: 'javascript',
  go: 'go', rs: 'rust', rb: 'ruby', swift: 'swift', java: 'java',
  kt: 'kotlin', scala: 'scala', php: 'php', cs: 'csharp',
  c: 'c', h: 'c', cpp: 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'cpp',
  m: 'objectivec', mm: 'objectivec',
  sh: 'bash', bash: 'bash', zsh: 'bash', fish: 'bash',
  ps1: 'powershell',
  sql: 'sql',
  json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'toml',
  ini: 'ini', conf: 'ini', cfg: 'ini',
  xml: 'xml', html: 'xml', htm: 'xml', svg: 'xml',
  css: 'css', scss: 'scss', less: 'less',
  dockerfile: 'dockerfile',
  makefile: 'makefile', mk: 'makefile',
  lua: 'lua', r: 'r', dart: 'dart', ex: 'elixir', exs: 'elixir',
  erl: 'erlang', clj: 'clojure', hs: 'haskell',
  tex: 'latex', vim: 'vim', diff: 'diff', patch: 'diff',
  // Plaintext / unknown — render monospace but skip highlighting.
  txt: 'plaintext', log: 'plaintext', '': 'plaintext',
};
function isCodeMode() {
  return state.fileExt !== '' && state.fileExt !== 'md' && state.fileExt !== 'markdown';
}
function hljsLangFor(ext) {
  if (Object.prototype.hasOwnProperty.call(EXT_TO_HLJS_LANG, ext)) {
    return EXT_TO_HLJS_LANG[ext];
  }
  return 'plaintext';
}

// Tracks the read state we last applied per comment id. Used to decide whether
// a comment's ✓ → ✓✓ transition should animate (newly-read) or appear instantly
// (already known to be read at last render).
const lastRenderedReadState = new Map();

// ─── parsing source into blocks ────────────────────────────────────────────────
function splitBlocks(src) {
  // Code-mode (.py / .txt / .js / …): one block per line, GitHub-style.
  // Each line is independently commentable; line numbers map 1:1 to anchorLine.
  if (isCodeMode()) {
    const lines = src.split('\n');
    // Drop a single trailing empty line (the artifact of files ending in \n),
    // but keep internal blank lines — they're real anchors in code.
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines.map((text, i) => ({ start: i, text }));
  }
  const lines = src.split('\n');
  const blocks = [];
  let cur = [], curStart = 0;
  let inFence = false, fenceMarker = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(/^(\s*)(```+|~~~+)/);
    if (m) {
      if (!inFence) { inFence = true; fenceMarker = m[2]; }
      else if (line.includes(fenceMarker)) { inFence = false; }
    }
    const blank = line.trim() === '';
    if (blank && !inFence) {
      if (cur.length) { blocks.push({ start: curStart, text: cur.join('\n') }); cur = []; }
      curStart = i + 1;
    } else {
      if (cur.length === 0) curStart = i;
      cur.push(line);
    }
  }
  if (cur.length) blocks.push({ start: curStart, text: cur.join('\n') });
  return blocks;
}

// ─── Images ────────────────────────────────────────────────────────────────
// document.baseURI is the resource bundle inside the .app, not the document
// being reviewed, so every relative image path in a markdown file would
// otherwise resolve into the bundle. And WebKit refuses file: URLs outside the
// directory passed to loadFileURL(_:allowingReadAccessTo:). So each <img> gets
// its src rewritten to the hrimg: scheme, which Swift serves from disk.

// Link reference definitions ([label]: target) collected from the WHOLE file.
// Blocks are parsed one at a time, so a definition sitting in its own block is
// invisible to the block that uses it; appending them to every block is what
// makes reference-style images and links resolve.
function collectLinkDefinitions(src) {
  const defs = [];
  let inFence = false, fenceMarker = '';
  for (const line of src.split('\n')) {
    const fence = line.match(/^(\s*)(```+|~~~+)/);
    if (fence) {
      if (!inFence) { inFence = true; fenceMarker = fence[2]; }
      else if (line.includes(fenceMarker)) { inFence = false; }
      continue;
    }
    if (inFence) continue;
    if (/^ {0,3}\[[^\]]+\]:\s*\S+/.test(line)) defs.push(line.trim());
  }
  return defs.join('\n');
}

function withLinkDefinitions(text) {
  if (!state.linkDefs) return text;
  return text + '\n\n' + state.linkDefs;
}

// Collapse '.' and '..' segments. The Swift handler canonicalizes again before
// reading — this side is for a tidy, comparable URL, not for enforcement.
function normalizePath(path) {
  const out = [];
  for (const segment of path.split('/')) {
    if (segment === '' || segment === '.') continue;
    if (segment === '..') { out.pop(); continue; }
    out.push(segment);
  }
  return '/' + out.join('/');
}

function decodePathSegment(segment) {
  try { return decodeURIComponent(segment); } catch (_) { return segment; }
}

// Returns {kind:'inline'} to leave the src alone, {kind:'blocked'} for anything
// that would reach the network, or {kind:'file', url} pointing at hrimg:.
function resolveImageSource(raw, baseDir) {
  const src = (raw || '').trim();
  if (!src) return { kind: 'blocked', reason: 'empty source' };
  if (/^data:/i.test(src)) return { kind: 'inline' };
  if (/^hrimg:/i.test(src)) return { kind: 'inline' };

  let path = null;
  const schemeMatch = src.match(/^([a-z][a-z0-9+.\-]*):/i);
  if (schemeMatch && schemeMatch[1].toLowerCase() === 'file') {
    path = src.replace(/^file:\/\//i, '');
  } else if (schemeMatch) {
    return { kind: 'blocked', reason: schemeMatch[1].toLowerCase() + ' images are not fetched' };
  } else if (src.charAt(0) === '/') {
    path = src;
  } else if (baseDir) {
    path = baseDir + '/' + src;
  } else {
    return { kind: 'blocked', reason: 'no directory to resolve against' };
  }

  const decoded = path.split('/').map(decodePathSegment).join('/');
  const normalized = normalizePath(decoded);
  const encoded = normalized.split('/').map(encodeURIComponent).join('/');
  return { kind: 'file', url: 'hrimg://local' + encoded, path: normalized };
}

function replaceImageWithNote(img, cssClass, label, detail) {
  const note = document.createElement('span');
  note.className = 'img-note ' + cssClass;
  note.textContent = label + ' ';
  const code = document.createElement('code');
  code.textContent = detail;
  note.appendChild(code);
  if (img.parentNode) img.parentNode.replaceChild(note, img);
}

// Rewrite every <img> under `root`. Idempotent — already-rewritten images carry
// data-hr-resolved and are skipped, so repeat renders don't re-resolve.
// marked 15 does not escape the image description, so
// `![" onerror="alert(1)](x.png)` closes the alt attribute and injects its own.
// Every attribute an image legitimately needs is known, so drop the rest of the
// injectable surface: event handlers, and srcset, which would reach the network
// behind the src we control.
function stripUnsafeImageAttributes(img) {
  for (const attribute of Array.from(img.attributes)) {
    const name = attribute.name.toLowerCase();
    const isEventHandler = name.indexOf('on') === 0;
    if (isEventHandler || name === 'srcset') img.removeAttribute(attribute.name);
  }
}

function resolveImagesIn(root, baseDir) {
  if (!root) return;
  for (const img of Array.from(root.querySelectorAll('img'))) {
    if (img.dataset.hrResolved) continue;
    stripUnsafeImageAttributes(img);
    const original = img.getAttribute('src') || '';
    const resolved = resolveImageSource(original, baseDir);
    img.dataset.hrResolved = '1';
    if (resolved.kind === 'inline') continue;
    if (resolved.kind === 'blocked') {
      replaceImageWithNote(img, 'blocked', resolved.reason + ':', original);
      continue;
    }
    img.addEventListener('error', function () {
      replaceImageWithNote(img, 'missing', 'image not found:', resolved.path);
    }, { once: true });
    img.setAttribute('src', resolved.url);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// ─── Mermaid post-processor ────────────────────────────────────────────────
// Marked renders ```mermaid fenced blocks as <pre><code class="language-mermaid">.
// After every render we walk those, ask mermaid to produce SVG, and swap them
// in. Errors render as a small inline diagnostic so the user sees what broke.
// Render every ```mermaid``` fenced block found under `root`.
//
// Two important details:
//   1. We transform marked's <pre><code class="language-mermaid">SRC</code></pre>
//      into <div class="mermaid">SRC</div> so we can hand them to mermaid.run().
//   2. mermaid.run({nodes:...}) marks each node with data-processed="true" after
//      it succeeds, so a second invocation (e.g. after the GUI auto-reloads the
//      sidecar a few ms later) skips already-rendered diagrams. That fixes the
//      original race: my previous per-block render() invoked async work on a
//      <pre> reference, and a concurrent DOM rebuild orphaned the reference
//      mid-flight — so the first paint had unrendered diagrams.
async function renderMermaidIn(root) {
  if (!root || !window.mermaid) return;

  // Step 1: marked → mermaid input shape (idempotent).
  root.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const src = code.textContent || '';
    const pre = code.parentElement;
    if (!pre || !pre.isConnected) return;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = src;
    pre.replaceWith(div);
  });

  const fresh = Array.from(root.querySelectorAll('.mermaid:not([data-processed="true"])'));
  if (fresh.length === 0) {
    // Already-processed diagrams may need to be wrapped (e.g. after an external
    // re-render that lost wrappers). Just re-wrap what we find.
    wrapMermaidBlocks(root);
    return;
  }

  try {
    await mermaid.run({ nodes: fresh, suppressErrors: false });
  } catch (e) {
    for (const node of fresh) {
      if (!node.querySelector('svg')) {
        node.className = 'mermaid-error';
        node.textContent = `mermaid render error:\n${(e && e.message) || e}\n\n--- source ---\n${node.textContent}`;
        node.removeAttribute('data-processed');
      }
    }
  }
  wrapMermaidBlocks(root);
  cleanupMermaidStrays();
}

// Wrap each successfully-rendered .mermaid in a .mermaid-block with a
// click-to-zoom affordance. Idempotent via data-wrapped.
function wrapMermaidBlocks(root) {
  root.querySelectorAll('.mermaid[data-processed="true"]:not([data-wrapped="1"])').forEach(t => {
    t.setAttribute('data-wrapped', '1');
    const block = document.createElement('div');
    block.className = 'mermaid-block';
    block.title = 'Click to enlarge';
    block.style.cursor = 'zoom-in';
    while (t.firstChild) block.appendChild(t.firstChild);
    t.replaceWith(block);
    block.addEventListener('click', () => openDiagramOverlay(block));
  });
}

// ─── hljs post-processor for markdown fenced code blocks ────────────────
// marked emits ```lang fenced blocks as <pre><code class="language-lang">.
// This walks each one and runs hljs.highlightElement, matching the styling
// we already use in whole-file code mode. Skips .language-mermaid (that's
// the mermaid post-processor's job) and anything already highlighted (hljs
// marks nodes with a `data-highlighted` attribute — idempotent, so calling
// it twice after auto-reload is safe).
function highlightMarkdownCodeIn(root) {
  if (!root || !window.hljs) return;
  root.querySelectorAll('pre > code[class*="language-"]').forEach(el => {
    if (el.classList.contains('language-mermaid')) return;
    if (el.dataset.highlighted === 'yes') return;
    try { hljs.highlightElement(el); } catch (_) { /* leave un-highlighted */ }
  });
}

// Click-to-zoom overlay for diagrams. Reuses the cross-link overlay container
// with a toolbar (zoom in/out/reset, %), drag-to-pan, and wheel/pinch zoom.
function openDiagramOverlay(block) {
  const svg = block.querySelector('svg');
  if (!svg) return;
  const overlay = document.getElementById('overlay');
  const body = document.getElementById('overlay-body');
  document.getElementById('overlay-path').textContent = 'Diagram';
  state.overlay = { kind: 'diagram' };

  body.innerHTML = '';

  // Toolbar
  const tb = document.createElement('div');
  tb.className = 'diagram-toolbar';
  tb.innerHTML = `
    <button class="diagram-btn" data-z="out" title="Zoom out">−</button>
    <button class="diagram-btn" data-z="in"  title="Zoom in">＋</button>
    <span class="diagram-zoom-label">100%</span>
    <button class="diagram-btn" data-z="fit"   title="Fit to window">Fit</button>
    <button class="diagram-btn" data-z="reset" title="Reset to 100%">100%</button>
    <span class="diagram-hint">drag to pan · wheel/pinch zooms · dbl-click resets</span>
  `;
  body.appendChild(tb);

  // Stage
  const stage = document.createElement('div');
  stage.className = 'diagram-stage';
  const clone = svg.cloneNode(true);
  clone.removeAttribute('width');
  clone.removeAttribute('height');
  stage.appendChild(clone);
  body.appendChild(stage);

  let scale = 1, tx = 0, ty = 0;
  const label = tb.querySelector('.diagram-zoom-label');
  const MIN = 0.2, MAX = 20;
  const apply = () => {
    clone.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    label.textContent = Math.round(scale * 100) + '%';
  };

  // Compute the scale that makes the SVG fit the stage (used by Fit and as
  // the initial size).
  const fitScale = () => {
    const sr = stage.getBoundingClientRect();
    const vb = clone.getBoundingClientRect();
    if (!vb.width || !vb.height) return 1;
    return Math.min(sr.width / (vb.width / scale), sr.height / (vb.height / scale)) * 0.95;
  };

  // Wheel + pinch (trackpad delivers pinch as wheel + ctrlKey).
  stage.addEventListener('wheel', (e) => {
    if (!state.overlay || state.overlay.kind !== 'diagram') return;
    e.preventDefault();
    const speed = e.ctrlKey ? 0.025 : 0.006;
    scale = Math.min(MAX, Math.max(MIN, scale - e.deltaY * speed));
    apply();
  }, { passive: false });

  // Toolbar
  tb.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-z]');
    if (!btn) return;
    const z = btn.getAttribute('data-z');
    if (z === 'in')    scale = Math.min(MAX, scale * 1.25);
    if (z === 'out')   scale = Math.max(MIN, scale / 1.25);
    if (z === 'reset') { scale = 1; tx = 0; ty = 0; }
    if (z === 'fit')   { scale = Math.min(MAX, Math.max(MIN, fitScale())); tx = 0; ty = 0; }
    apply();
  });

  // Drag-to-pan
  let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
  stage.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startTx = tx; startTy = ty;
    e.preventDefault();
  });
  const onMove = (e) => {
    if (!dragging) return;
    tx = startTx + (e.clientX - startX);
    ty = startTy + (e.clientY - startY);
    apply();
  };
  const onUp = () => { dragging = false; };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  // Reset on double-click of the SVG.
  stage.addEventListener('dblclick', () => { scale = 1; tx = 0; ty = 0; apply(); });

  apply();
  overlay.classList.add('visible');
  overlay.setAttribute('aria-hidden', 'false');
}

function cleanupMermaidStrays() {
  // Remove any temp containers mermaid leaves on the body.
  document.body.querySelectorAll(
    'div[id^="dmmid-"], iframe[id^="iframemmid-"], svg[aria-roledescription="error"]'
  ).forEach(el => {
    if (el.parentElement === document.body) el.remove();
  });
  // Mermaid v11 in some failure modes appends a Syntax-error SVG directly
  // to <body>; identify it by its 'error-icon' class.
  document.body.querySelectorAll('svg.error').forEach(el => {
    if (el.parentElement === document.body) el.remove();
  });
}

// ─── thread grouping ───────────────────────────────────────────────────────────
function byId() {
  const m = new Map();
  for (const c of state.comments) m.set(c.id, c);
  return m;
}

function rootOf(c, idx) {
  let cur = c, safety = 0;
  while (cur && cur.replyTo && safety++ < 1000) {
    cur = idx.get(cur.replyTo) || null;
  }
  return cur;
}

function buildThreads() {
  // Returns: rootId -> { root, comments: [chronological list including root] }
  const idx = byId();
  const threads = new Map();
  for (const c of state.comments) {
    const r = rootOf(c, idx);
    if (!r) continue;  // orphan-of-tree: replyTo points to nothing
    if (!threads.has(r.id)) threads.set(r.id, { root: r, comments: [] });
    threads.get(r.id).comments.push(c);
  }
  for (const t of threads.values()) {
    t.comments.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  }
  return threads;
}

function threadsForBlock(line, threads) {
  // Only block-scoped, non-orphan threads anchored to this line.
  const result = [];
  for (const t of threads.values()) {
    if (t.root.scope !== 'block') continue;
    if (t.root.anchorLine === line && !t.root.orphaned) result.push(t);
  }
  return result.sort((a, b) => new Date(a.root.createdAt) - new Date(b.root.createdAt));
}

function activeThreadLines(threads) {
  const lines = new Set();
  for (const t of threads.values()) {
    if (t.root.scope !== 'block') continue;
    if (!t.root.resolved && !t.root.orphaned) lines.add(t.root.anchorLine);
  }
  return Array.from(lines).sort((a, b) => a - b);
}

function globalThreads(threads) {
  return Array.from(threads.values())
    .filter(t => t.root.scope === 'global')
    .sort((a, b) => new Date(a.root.createdAt) - new Date(b.root.createdAt));
}

function activeGlobalThreadIds(threads) {
  return globalThreads(threads)
    .filter(t => !t.root.resolved)
    .map(t => t.root.id);
}

// ─── messaging swift ───────────────────────────────────────────────────────────
function postSwift(payload) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.swift) {
    window.webkit.messageHandlers.swift.postMessage(payload);
  }
}

// ─── rendering ────────────────────────────────────────────────────────────────
function renderComment(c, idx) {
  const dt = new Date(c.createdAt);
  const date = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const time = dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const isAgent = (c.author || '').toLowerCase() === 'agent';
  const isReply = !!c.replyTo;
  const readers = Array.isArray(c.readBy) ? c.readBy : [];
  const isRead = readers.length > 0;
  const tooltip = isRead ? `read by ${readers.join(', ')}` : 'delivered';
  // Render WITHOUT .read class — the post-render hook adds it (synchronously
  // for already-known-read comments → no animation; via rAF for newly-read
  // comments → smooth transition).
  const receipt = `
    <div class="read-receipt" data-cid="${escapeHtml(c.id)}" data-read="${isRead ? '1' : '0'}" title="${escapeHtml(tooltip)}">
      <span class="check">✓</span><span class="check check-2">✓</span>
    </div>
  `;
  const bodyHtml = (window.marked && marked.parse) ? marked.parse(withLinkDefinitions(c.body || '')) : escapeHtml(c.body || '');
  return `
    <div class="comment ${isAgent ? 'is-agent' : ''}" data-id="${escapeHtml(c.id)}">
      <div class="comment-head">
        <span class="author">${escapeHtml(c.author)}</span>
        ${isReply ? '<span class="reply-marker">↪ reply</span>' : ''}
        <span>${date} ${time}</span>
        <span class="spacer"></span>
        <button data-action="delete-comment" data-id="${escapeHtml(c.id)}">Delete</button>
      </div>
      <div class="comment-body">${bodyHtml}</div>
      ${receipt}
    </div>
  `;
}

function renderComposer({ placeholder, primaryLabel, action, dataAttrs, hint, composerKey }) {
  const attrs = Object.entries(dataAttrs || {})
    .map(([k, v]) => `data-${k}="${escapeHtml(String(v))}"`).join(' ');
  // No `autofocus` attribute — it re-fires on every dynamic insertion and
  // would steal focus on every render. Focus is set explicitly in render()
  // for newly-opened composers, and restoreComposers() restores focus for
  // composers the user was already typing in when an external reload hit.
  return `
    <div class="composer" data-composer-key="${escapeHtml(composerKey)}" ${attrs}>
      <textarea placeholder="${escapeHtml(placeholder)}"></textarea>
      <div class="composer-actions">
        <span class="hint">${escapeHtml(hint || '')}</span>
        <button class="mic" data-action="start-dictation" title="Dictate (Fn-Fn)" aria-label="Dictate">🎤</button>
        <button data-action="cancel">Cancel</button>
        <button class="primary" data-action="${action}" ${attrs}>${escapeHtml(primaryLabel)}</button>
      </div>
    </div>
  `;
}

function renderThread(t, inSidebar) {
  const settled = t.root.resolved;
  const expanded = !settled || state.expandedSettled.has(t.root.id);
  const replyOpen = state.replyComposerRoot === t.root.id;
  const count = t.comments.length;
  const focusedSidebar = (t.root.scope === 'global' && state.focusedSidebarThread === t.root.id);
  const sidebarReplying = inSidebar && state.sidebarReplyTo === t.root.id;

  let html = `<div class="thread ${settled ? 'settled' : ''} ${settled && !expanded ? 'collapsed' : ''} ${focusedSidebar ? 'focused-sidebar' : ''} ${sidebarReplying ? 'replying' : ''}"
                   data-root="${escapeHtml(t.root.id)}">`;
  // Head
  html += `<div class="thread-head" data-action="${settled ? 'toggle-thread' : ''}" data-root="${escapeHtml(t.root.id)}">
    <span class="line">L${t.root.anchorLine + 1}</span>
    <span class="status ${settled ? 'settled' : 'active'}">
      ${settled ? '✓ Resolved' : '● Active'}
    </span>
    <span class="count">${count} ${count === 1 ? 'msg' : 'msgs'}</span>
    <span class="spacer"></span>
    ${settled
      ? `<button data-action="reopen-thread" data-root="${escapeHtml(t.root.id)}">Reopen</button>`
      : `<button data-action="resolve-thread" data-root="${escapeHtml(t.root.id)}">Resolve</button>`
    }
  </div>`;

  // Body
  html += `<div class="thread-body">`;
  for (const c of t.comments) html += renderComment(c);
  // Sidebar threads never get their own composer — the user replies via the
  // single pinned composer at the bottom of the sidebar (click the thread to
  // put that composer in reply mode).
  if (!inSidebar && (!settled || replyOpen)) {
    html += renderComposer({
      placeholder: settled ? 'Reply (will re-open this thread)…' : 'Reply to this thread…',
      primaryLabel: settled ? 'Reply & reopen' : 'Reply',
      action: 'submit-reply',
      dataAttrs: { root: t.root.id },
      hint: 'Tab to submit · Esc to cancel',
      composerKey: `reply:${t.root.id}`,
    });
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

// ─── Composer draft snapshot / restore ─────────────────────────────────────
// External sidecar reloads (agent post, GUI auto-refresh) replace the entire
// `#content` subtree — which wipes any inline composer textarea the user is
// typing in. To keep what they've typed AND keep focus, we snapshot every
// composer's textarea state before re-render, then restore it from
// state.drafts after the new DOM is in place. Drafts are keyed by a stable
// composer key (e.g. `new:<line>`, `reply:<root>`, `sidebar`) baked into a
// `data-composer-key` attribute by renderComposer.
//
// snapshotComposers() also returns the key of whichever composer textarea
// currently owns document focus, so restoreComposers() can put focus back on
// the same composer in the new DOM.
function snapshotComposers() {
  const active = document.activeElement;
  let focusedKey = null;
  document.querySelectorAll('.composer').forEach(c => {
    const key = c.getAttribute('data-composer-key');
    if (!key) return;
    const ta = c.querySelector('textarea');
    if (!ta) return;
    state.drafts.set(key, {
      value: ta.value,
      selStart: ta.selectionStart ?? ta.value.length,
      selEnd:   ta.selectionEnd   ?? ta.value.length,
    });
    if (ta === active) focusedKey = key;
  });
  return focusedKey;
}

function restoreComposers(focusedKey) {
  document.querySelectorAll('.composer').forEach(c => {
    const key = c.getAttribute('data-composer-key');
    if (!key) return;
    const ta = c.querySelector('textarea');
    if (!ta) return;
    const d = state.drafts.get(key);
    if (d && d.value && ta.value !== d.value) {
      // For the sidebar composer the textarea element survives renders so
      // ta.value already matches d.value — skipping the write avoids
      // clobbering a fresh keystroke that landed between snapshot and
      // restore. For inline composers (just-rebuilt DOM) ta.value is empty
      // and we restore from the draft.
      ta.value = d.value;
    }
    if (d) {
      try { ta.setSelectionRange(d.selStart, d.selEnd); } catch (_) { /* ignore */ }
    }
  });
  if (focusedKey) {
    const el = document.querySelector(`.composer[data-composer-key="${focusedKey}"] textarea`);
    if (el) { el.focus({ preventScroll: true }); return true; }
  }
  return false;
}

function render() {
  const focusedComposerKey = snapshotComposers();
  const container = document.getElementById('content');
  // #content is now the doc scroll container (the body is locked to viewport
  // height so the sidebar scroll region is unambiguous). Snapshot its
  // scrollTop so re-renders don't yank the user to the top.
  const scrollY = container ? container.scrollTop : 0;
  const frag = document.createDocumentFragment();
  const threads = buildThreads();

  // Toggle a body class so code-mode CSS (line numbers, monospace, tighter
  // grid layout, etc.) kicks in without per-block class noise.
  document.body.classList.toggle('code-mode', isCodeMode());
  const codeMode = isCodeMode();
  const hljsLang = codeMode ? hljsLangFor(state.fileExt) : null;

  for (const b of state.blocks) {
    const div = document.createElement('div');
    const blockThreads = threadsForBlock(b.start, threads);
    const hasActive = blockThreads.some(t => !t.root.resolved);
    const classes = ['block'];
    if (blockThreads.length) classes.push('has-threads');
    if (hasActive) classes.push('has-active');
    if (state.focusedBlock === b.start) classes.push('focused');
    div.className = classes.join(' ');
    div.setAttribute('data-line', String(b.start));
    if (codeMode) div.setAttribute('data-line-1based', String(b.start + 1));

    let threadsHtml = '';
    if (blockThreads.length) {
      threadsHtml = '<div class="threads">';
      for (const t of blockThreads) threadsHtml += renderThread(t);
      threadsHtml += '</div>';
    }
    const newComposerHtml = state.newComposerBlock === b.start ? renderComposer({
      placeholder: codeMode ? `Comment on line ${b.start + 1}…` : 'Start a new thread on this block…',
      primaryLabel: 'Comment',
      action: 'submit-new',
      dataAttrs: { line: b.start, text: b.text },
      hint: 'Tab to submit · Esc to cancel',
      composerKey: `new:${b.start}`,
    }) : '';

    let bodyHtml;
    if (codeMode) {
      // One line per block — escape it, hand it to hljs in a synchronous pass.
      // hljs.highlight returns a {value: 'html-with-spans'} object; we trust
      // that output (hljs escapes everything it touches). For 'plaintext' the
      // result is just escaped HTML with a single .hljs wrapper class.
      let highlighted;
      try {
        highlighted = window.hljs
          ? hljs.highlight(b.text || '', { language: hljsLang, ignoreIllegals: true }).value
          : escapeHtml(b.text || '');
      } catch (_) {
        highlighted = escapeHtml(b.text || '');
      }
      // Use ​ (zero-width space) on truly empty lines so the .block-body
      // grid cell still occupies a row instead of collapsing to 0 height.
      if (!highlighted) highlighted = '​';
      bodyHtml = `<pre class="code-line"><code class="hljs language-${hljsLang}">${highlighted}</code></pre>`;
    } else {
      bodyHtml = marked.parse(withLinkDefinitions(b.text));
    }

    // In code mode the clickable gutter (line number) IS the "new thread"
     // affordance; suppress the absolutely-positioned + button (CSS hides it
     // too, but skipping the markup keeps the DOM cleaner and avoids it
     // ever being a tab stop / a11y target).
    const linenoOrPlus = codeMode
      ? `<button class="lineno" data-action="open-new" data-line="${b.start}" data-text="${escapeHtml(b.text)}" title="Comment on line ${b.start + 1}">${b.start + 1}</button>`
      : `<button class="add-btn" data-action="open-new" data-line="${b.start}" data-text="${escapeHtml(b.text)}" title="New thread">+</button>`;
    div.innerHTML = `
      ${linenoOrPlus}
      <div class="block-body">${bodyHtml}</div>
      ${threadsHtml}
      ${newComposerHtml}
    `;
    frag.appendChild(div);
  }

  // Orphaned threads — comments whose root.orphaned=true
  const orphanRoots = Array.from(threads.values()).filter(t => t.root.orphaned);
  if (orphanRoots.length) {
    const sec = document.createElement('div');
    sec.className = 'orphan-section';
    sec.innerHTML = `<h3 class="orphan-title">⚠ Orphaned threads (anchor text gone from source)</h3>`;
    const wrap = document.createElement('div');
    wrap.className = 'threads';
    for (const t of orphanRoots) wrap.innerHTML += renderThread(t);
    sec.appendChild(wrap);
    frag.appendChild(sec);
  }

  container.replaceChildren(frag);
  if (container.scrollTop !== scrollY) container.scrollTop = scrollY;

  // ── Render the global-chat sidebar ──────────────────────────────────────
  renderSidebar(threads);

  // ── Render any ```mermaid``` diagrams in content + sidebar ──────────────
  // Fire-and-forget — mermaid.render is async; the rest of the render path
  // doesn't depend on diagrams being painted.
  // Point every <img> at the hrimg: scheme before mermaid/hljs touch the DOM.
  resolveImagesIn(document.getElementById('content'), state.fileDir);
  resolveImagesIn(document.getElementById('sidebar-threads'), state.fileDir);
  renderMermaidIn(document.getElementById('content'));
  renderMermaidIn(document.getElementById('sidebar-threads'));
  // Syntax-highlight ```lang fenced blocks in markdown content + comment
  // bodies (sidebar threads + inline replies). Idempotent — hljs marks each
  // element with data-highlighted so repeat calls after auto-reload no-op.
  highlightMarkdownCodeIn(document.getElementById('content'));
  highlightMarkdownCodeIn(document.getElementById('sidebar-threads'));

  // ── Read-receipt state promotion ─────────────────────────────────────────
  // Comments already known-read at the last render get .read added BEFORE
  // paint (no animation — they should appear settled). Newly-read ones get
  // it added on the next animation frame so the CSS transition fires.
  const toAnimate = [];
  document.querySelectorAll('.read-receipt[data-read="1"]').forEach(el => {
    const cid = el.getAttribute('data-cid');
    if (lastRenderedReadState.get(cid) === true) {
      el.classList.add('read');                 // synchronous; no transition
    } else {
      toAnimate.push(el);                       // deferred; transition kicks in
    }
  });
  if (toAnimate.length) {
    requestAnimationFrame(() => {
      // Two RAFs to be safe — first ensures initial styles painted, second
      // applies the .read class so the transition has somewhere to go from.
      requestAnimationFrame(() => {
        for (const el of toAnimate) el.classList.add('read');
      });
    });
  }
  // Update cache for next render.
  for (const c of state.comments) {
    lastRenderedReadState.set(c.id, (c.readBy || []).length > 0);
  }

  // Restore composer drafts (value + selection) and put focus back on
  // whichever composer the user was typing in before the re-render.
  // Returns true if focus was restored, in which case the explicit-open
  // fallback below should NOT run.
  const focusRestored = restoreComposers(focusedComposerKey);

  // Auto-focus ONLY a composer the user explicitly just opened, and only
  // if restoreComposers didn't already park focus somewhere.
  //
  // Active threads always render a reply composer at the bottom (it's a
  // standing affordance). If we auto-focused any composer we found, that
  // textarea would grab focus on every render — silently swallowing 'n',
  // 'j', arrow keys, etc. and breaking keyboard navigation entirely.
  //
  // Only focus when state explicitly says the user opened something:
  //   - newComposerBlock set ⇒ a "new thread" composer is the active one
  //   - replyComposerRoot set ⇒ a reply composer (e.g. for a settled thread
  //     the user is reopening) is the active one
  if (!focusRestored) {
    let toFocus = null;
    if (state.newComposerBlock !== null) {
      toFocus = document.querySelector(`.composer[data-composer-key="new:${state.newComposerBlock}"] textarea`);
    } else if (state.replyComposerRoot !== null) {
      toFocus = document.querySelector(`.composer[data-composer-key="reply:${state.replyComposerRoot}"] textarea`);
    }
    if (toFocus) toFocus.focus({ preventScroll: true });
  }
}

// ─── navigation between blocks ─────────────────────────────────────────────────
function focusedIndex() {
  if (state.focusedBlock === null) return -1;
  return state.blocks.findIndex(b => b.start === state.focusedBlock);
}

function moveFocus(delta) {
  if (!state.blocks.length) return;
  let idx = focusedIndex();
  if (idx < 0) {
    idx = delta > 0 ? 0 : state.blocks.length - 1;
  } else {
    idx = Math.max(0, Math.min(state.blocks.length - 1, idx + delta));
  }
  state.focusedBlock = state.blocks[idx].start;
  render();
  scrollFocusedIntoView();
}

function focusNext() {
  const idx = focusedIndex();
  if (idx >= 0 && idx + 1 < state.blocks.length) {
    state.focusedBlock = state.blocks[idx + 1].start;
  }
}

function scrollFocusedIntoView() {
  const el = document.querySelector(`.block[data-line="${state.focusedBlock}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/// Unified n/N rotation list: every active focus target on the page, in order.
/// Inline block-anchored threads come first (sorted by line), then sidebar
/// global threads (sorted by createdAt — matches what's already rendered).
function activeFocusTargets(threads) {
  const targets = [];
  const seenLines = new Set();
  for (const line of activeThreadLines(threads)) {
    if (seenLines.has(line)) continue;
    seenLines.add(line);
    targets.push({ kind: 'block', line });
  }
  for (const id of activeGlobalThreadIds(threads)) {
    targets.push({ kind: 'sidebar', id });
  }
  return targets;
}

function targetEquals(t, kind, key) {
  if (t.kind !== kind) return false;
  return t.kind === 'block' ? t.line === key : t.id === key;
}

function currentTarget() {
  if (state.focusedSidebarThread) return { kind: 'sidebar', id: state.focusedSidebarThread };
  if (state.focusedBlock !== null) return { kind: 'block', line: state.focusedBlock };
  return null;
}

function applyTarget(t) {
  if (t.kind === 'block') {
    state.focusedBlock = t.line;
    state.focusedSidebarThread = null;
  } else {
    state.focusedBlock = null;
    state.focusedSidebarThread = t.id;
  }
}

function nextActiveThread(direction) {
  const targets = activeFocusTargets(buildThreads());
  if (!targets.length) return;
  const cur = currentTarget();
  let idx = -1;
  if (cur) {
    idx = targets.findIndex(t => targetEquals(t, cur.kind, cur.kind === 'block' ? cur.line : cur.id));
  }
  let nextIdx;
  if (idx === -1) {
    nextIdx = direction > 0 ? 0 : targets.length - 1;
  } else {
    nextIdx = (idx + direction + targets.length) % targets.length;
  }
  applyTarget(targets[nextIdx]);
  render();
  if (targets[nextIdx].kind === 'block') {
    scrollFocusedIntoView();
    pulseBlock(targets[nextIdx].line);
  } else {
    scrollSidebarThreadIntoView(targets[nextIdx].id);
    pulseSidebarThread(targets[nextIdx].id);
  }
}

function scrollSidebarThreadIntoView(rootId) {
  const el = document.querySelector(`#sidebar-threads .thread[data-root="${rootId}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function pulseSidebarThread(rootId) {
  const el = document.querySelector(`#sidebar-threads .thread[data-root="${rootId}"]`);
  if (!el) return;
  el.classList.remove('pulse-thread');
  void el.offsetWidth;
  el.classList.add('pulse-thread');
  setTimeout(() => el.classList.remove('pulse-thread'), 700);
}

function pulseBlock(line) {
  const el = document.querySelector(`.block[data-line="${line}"]`);
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 700);
}

// ─── click handling ────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.getAttribute('data-action');
  e.stopPropagation();

  if (action === 'open-new') {
    const line = parseInt(t.getAttribute('data-line'), 10);
    state.newComposerBlock = line;
    state.replyComposerRoot = null;
    render();
    return;
  }
  if (action === 'cancel') {
    const composer = t.closest('.composer');
    const key = composer && composer.getAttribute('data-composer-key');
    if (key) state.drafts.delete(key);
    state.newComposerBlock = null;
    state.replyComposerRoot = null;
    render();
    return;
  }
  if (action === 'submit-new') {
    const composer = t.closest('.composer');
    const body = (composer.querySelector('textarea').value || '').trim();
    if (!body) return;
    const line = parseInt(t.getAttribute('data-line'), 10);
    const text = t.getAttribute('data-text') || '';
    postSwift({ type: 'addComment', line, text, body });
    state.drafts.delete(`new:${line}`);
    state.newComposerBlock = null;
    // Keep focus on the same block. Auto-advancing here used to make a
    // subsequent Enter open a composer on the next (unrelated) block.
    return;
  }
  if (action === 'submit-reply') {
    const composer = t.closest('.composer');
    const body = (composer.querySelector('textarea').value || '').trim();
    if (!body) return;
    const root = t.getAttribute('data-root');
    postSwift({ type: 'addComment', replyTo: root, body });
    state.drafts.delete(`reply:${root}`);
    state.replyComposerRoot = null;
    return;
  }
  if (action === 'resolve-thread') {
    const root = t.getAttribute('data-root');
    postSwift({ type: 'resolveThread', id: root });
    return;
  }
  if (action === 'reopen-thread') {
    const root = t.getAttribute('data-root');
    postSwift({ type: 'reopenThread', id: root });
    return;
  }
  if (action === 'toggle-thread') {
    const root = t.getAttribute('data-root');
    if (state.expandedSettled.has(root)) state.expandedSettled.delete(root);
    else state.expandedSettled.add(root);
    render();
    return;
  }
  if (action === 'delete-comment') {
    const id = t.getAttribute('data-id');
    postSwift({ type: 'deleteComment', id });
    return;
  }
});

// ─── keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Overlay takes priority for Esc — close it and swallow the event.
  if (state.overlay && e.key === 'Escape') {
    hideOverlay();
    e.preventDefault();
    return;
  }

  const inTextarea = e.target && e.target.tagName === 'TEXTAREA';
  const inComposerTextarea = inTextarea && e.target.closest('.composer');

  // Inside a composer textarea (whether state-machine-driven or an always-on
  // bottom-of-thread reply box): handle submit / cancel.
  if (inComposerTextarea) {
    const isCmdEnter = (e.metaKey || e.ctrlKey) && e.key === 'Enter';
    const isTabSubmit = e.key === 'Tab' && !e.shiftKey;
    if (isCmdEnter || isTabSubmit) {
      const composer = e.target.closest('.composer');
      const btn = composer && composer.querySelector('.primary');
      if (btn) { btn.click(); e.preventDefault(); }
      return;
    }
    if (e.key === 'Escape') {
      const composer = e.target.closest('.composer');
      const key = composer && composer.getAttribute('data-composer-key');
      if (key) state.drafts.delete(key);
      state.newComposerBlock = null;
      state.replyComposerRoot = null;
      e.target.blur();
      render();
      e.preventDefault();
      return;
    }
    return;
  }

  if (inTextarea) return;

  if (e.key === 'ArrowDown' || e.key === 'j') {
    moveFocus(1); e.preventDefault();
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    moveFocus(-1); e.preventDefault();
  } else if (e.key === 'Enter' && state.focusedBlock !== null) {
    // Decide: if focused block has an active thread → open reply on the
    // most recent one. Otherwise → open new-thread composer.
    const blockThreads = threadsForBlock(state.focusedBlock, buildThreads())
      .filter(t => !t.root.resolved);
    if (blockThreads.length) {
      state.replyComposerRoot = blockThreads[blockThreads.length - 1].root.id;
      state.newComposerBlock = null;
    } else {
      state.newComposerBlock = state.focusedBlock;
      state.replyComposerRoot = null;
    }
    render();
    e.preventDefault();
  } else if (e.key === 'n' && !e.shiftKey) {
    nextActiveThread(1); e.preventDefault();
  } else if (e.key === 'N' || (e.key === 'n' && e.shiftKey)) {
    nextActiveThread(-1); e.preventDefault();
  } else if (e.key === 'ArrowRight' || e.key === 'l') {
    // Next file (no modifier; outside any textarea/composer)
    postSwift({ type: 'nextFile' });
    e.preventDefault();
  } else if (e.key === 'ArrowLeft' || e.key === 'h') {
    postSwift({ type: 'prevFile' });
    e.preventDefault();
  }
});

// ─── Swift bridge ──────────────────────────────────────────────────────────────
// ─── Sidebar rendering (scope=global) ─────────────────────────────────────
function renderSidebar(threads) {
  const wrap = document.getElementById('sidebar-threads');
  if (!wrap) return;
  const items = globalThreads(threads);
  const summary = document.getElementById('sidebar-summary');
  if (summary) {
    const active = items.filter(t => !t.root.resolved).length;
    summary.textContent = items.length === 0 ? '0 messages' :
      `${items.length} thread${items.length === 1 ? '' : 's'} · ${active} active`;
  }
  // Auto-scroll-to-bottom heuristic: only snap to the latest if the user was
  // already near the bottom (within 60px). If they scrolled up to read
  // history, don't yank them down.
  const wasNearBottom = (wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight) < 60;
  if (items.length === 0) {
    wrap.innerHTML = `<div class="sidebar-empty">No messages yet. Use this for whole-document comments — start a thread with the composer below.</div>`;
  } else {
    wrap.innerHTML = items.map(t => renderThread(t, true)).join('');
    if (wasNearBottom) wrap.scrollTop = wrap.scrollHeight;
  }

  // Update the sidebar composer's reply banner + placeholder/button based on
  // whether the user has clicked a thread (state.sidebarReplyTo).
  const composer = document.getElementById('sidebar-composer');
  if (!composer) return;
  const ta = composer.querySelector('textarea');
  const btn = composer.querySelector('.primary');
  const oldBanner = composer.querySelector('.sidebar-reply-banner');
  if (oldBanner) oldBanner.remove();
  if (state.sidebarReplyTo) {
    const replyRoot = state.comments.find(c => c.id === state.sidebarReplyTo);
    const snippet = replyRoot ? (replyRoot.body || '').replace(/\n/g, ' ').slice(0, 60) : '';
    const banner = document.createElement('div');
    banner.className = 'sidebar-reply-banner';
    banner.innerHTML = `<span>↩ Replying to:</span><span class="snippet">${escapeHtml(snippet)}</span><button data-action="cancel-sidebar-reply" title="Cancel reply">✕</button>`;
    composer.insertBefore(banner, composer.firstChild);
    if (ta) ta.placeholder = 'Reply to this thread… (will re-open if settled)';
    if (btn) btn.textContent = 'Reply';
  } else {
    if (ta) ta.placeholder = 'Send a message about this document…';
    if (btn) btn.textContent = 'Send';
  }
}

// ─── Cross-link overlay ──────────────────────────────────────────────────
function ghSlug(text) {
  return (text || '').toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

function extractSection(source, fragment) {
  if (!fragment) return source;
  const lines = source.split('\n');
  const target = fragment.toLowerCase();
  let startIdx = -1, level = -1;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(#{1,6})\s+(.+?)\s*$/);
    if (!m) continue;
    const text = m[2];
    if (ghSlug(text) === target || text.toLowerCase().includes(target)) {
      startIdx = i; level = m[1].length;
      break;
    }
  }
  if (startIdx === -1) return null;
  let endIdx = lines.length;
  for (let i = startIdx + 1; i < lines.length; i++) {
    const m = lines[i].match(/^(#{1,6})\s+/);
    if (m && m[1].length <= level) { endIdx = i; break; }
  }
  return lines.slice(startIdx, endIdx).join('\n');
}

function showOverlay(payload) {
  const { path, fragment, source } = payload;
  state.overlay = { path, fragment };
  const sliced = fragment ? extractSection(source, fragment) : source;
  let bodyHtml;
  if (sliced == null) {
    bodyHtml = `<div class="overlay-empty">Anchor <code>#${escapeHtml(fragment)}</code> not found — showing full file.</div>`
             + ((window.marked && marked.parse) ? marked.parse(source || '') : escapeHtml(source || ''));
  } else {
    bodyHtml = (window.marked && marked.parse) ? marked.parse(sliced) : escapeHtml(sliced);
  }
  document.getElementById('overlay-body').innerHTML = bodyHtml;
  document.getElementById('overlay-path').textContent = path + (fragment ? '  ›  #' + fragment : '');
  const ov = document.getElementById('overlay');
  ov.classList.add('visible');
  ov.setAttribute('aria-hidden', 'false');
  document.getElementById('overlay-body').scrollTop = 0;
  // Images in a linked document resolve against THAT file's directory, not
  // the one being reviewed.
  const overlayDir = path.slice(0, path.lastIndexOf('/'));
  resolveImagesIn(document.getElementById('overlay-body'), overlayDir);
  // Render mermaid diagrams + hljs-highlight fenced code inside the
  // linked-document overlay too.
  renderMermaidIn(document.getElementById('overlay-body'));
  highlightMarkdownCodeIn(document.getElementById('overlay-body'));
}

function showOverlayError(payload) {
  const { path, fragment, reason } = payload;
  state.overlay = { path, fragment };
  document.getElementById('overlay-body').innerHTML =
    `<p>Could not open <code>${escapeHtml(path)}</code>:</p><pre>${escapeHtml(reason)}</pre>`;
  document.getElementById('overlay-path').textContent = path;
  document.getElementById('overlay').classList.add('visible');
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  ov.classList.remove('visible');
  ov.setAttribute('aria-hidden', 'true');
  state.overlay = null;
}

// ─── Link interceptor + overlay buttons + submit-global ──────────────────
// Intercept clicks on absolute file links (in main content, threads, or
// sidebar) and pop the overlay instead of navigating away.
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href]');
  if (a) {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('/') || href.startsWith('file:')) {
      e.preventDefault();
      e.stopPropagation();
      let raw = href.startsWith('file://') ? href.slice('file://'.length) : href;
      const hashIdx = raw.indexOf('#');
      const path = hashIdx >= 0 ? raw.slice(0, hashIdx) : raw;
      const fragment = hashIdx >= 0 ? raw.slice(hashIdx + 1) : '';
      postSwift({ type: 'fetchSection', path: decodeURIComponent(path), fragment: decodeURIComponent(fragment) });
      return;
    }
  }
  const t = e.target.closest && e.target.closest('[data-action]');
  if (!t) return;
  const action = t.getAttribute('data-action');
  if (action === 'overlay-close')           { hideOverlay(); return; }
  if (action === 'overlay-open-in-review')  {
    if (state.overlay && state.overlay.path) {
      postSwift({ type: 'openInSession', path: state.overlay.path });
    }
    hideOverlay(); return;
  }
  if (action === 'zoom-in')    { postSwift({ type: 'zoomIn' });    return; }
  if (action === 'zoom-out')   { postSwift({ type: 'zoomOut' });   return; }
  if (action === 'zoom-reset') { postSwift({ type: 'zoomReset' }); return; }
  if (action === 'search-prev')  { searchStep(-1); return; }
  if (action === 'search-next')  { searchStep(1);  return; }
  if (action === 'search-close') { closeSearch();  return; }
  if (action === 'start-dictation') {
    // WKWebView's textareas don't implement the `startDictation:` selector
    // (only NSText/NSTextView do — that's why TextEdit's menu works and ours
    // beeped). The only reliable trigger inside a WKWebView is the system
    // shortcut (Fn-Fn by default, configurable in System Settings ▸ Keyboard
    // ▸ Dictation), which is app-agnostic and routes spoken text to the
    // focused DOM element automatically.
    //
    // So the 🎤 button just focuses the textarea and flashes a tip telling
    // the user to press Fn-Fn. macOS handles everything from there.
    const composer = t.closest('.composer');
    const ta = composer && composer.querySelector('textarea');
    if (ta) ta.focus({ preventScroll: true });
    flashDictationTip(composer);
    return;
  }
  if (action === 'submit-global') {
    const composer = t.closest('.composer');
    const ta = composer.querySelector('textarea');
    const body = (ta.value || '').trim();
    if (!body) return;
    if (state.sidebarReplyTo) {
      // Bottom composer is in reply mode → post as reply to that thread.
      postSwift({ type: 'addComment', replyTo: state.sidebarReplyTo, body });
      state.sidebarReplyTo = null;
    } else {
      postSwift({ type: 'addGlobal', body });
    }
    ta.value = '';
    state.drafts.delete('sidebar');
    render();
    return;
  }
  if (action === 'cancel-sidebar-reply') {
    state.sidebarReplyTo = null;
    render();
    return;
  }

  // Click anywhere on a sidebar thread (outside its own buttons) → set up
  // bottom-composer reply mode targeting that thread.
  const sidebarThread = e.target.closest && e.target.closest('#sidebar-threads .thread');
  if (sidebarThread && !e.target.closest('button') && !e.target.closest('.composer')) {
    const root = sidebarThread.getAttribute('data-root');
    if (root) {
      state.sidebarReplyTo = root;
      render();
      // Focus the bottom composer's textarea
      const ta = document.querySelector('#sidebar-composer textarea');
      if (ta) ta.focus({ preventScroll: true });
    }
  }
});

function focusComment(id) {
  if (!id) return;
  const c = state.comments.find(cm => cm.id === id);
  if (!c) return;
  // Find the thread root so we know where to land.
  const idx = new Map(state.comments.map(c => [c.id, c]));
  let root = c;
  let safety = 0;
  while (root.replyTo && safety++ < 100) { root = idx.get(root.replyTo) || root; }
  if (root.scope === 'global') {
    state.focusedSidebarThread = root.id;
    state.focusedBlock = null;
    render();
    scrollSidebarThreadIntoView(root.id);
    pulseSidebarThread(root.id);
  } else {
    state.focusedBlock = root.anchorLine;
    state.focusedSidebarThread = null;
    render();
    scrollFocusedIntoView();
    pulseBlock(root.anchorLine);
  }
}

// ─── Dictation tip flash ───────────────────────────────────────────────────
// The 🎤 button can't actually trigger macOS dictation directly (the
// `startDictation:` selector isn't implemented by WKWebView's internal text
// inputs — only NSText/NSTextView). The Fn-Fn system shortcut is the only
// path that works inside a WKWebView, so the button's job is to point the
// user at it.
function flashDictationTip(composer) {
  if (!composer) return;
  const mic = composer.querySelector('button.mic');
  if (mic) {
    mic.classList.add('flash');
    setTimeout(() => mic.classList.remove('flash'), 800);
  }
  let tip = composer.querySelector('.dictation-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'dictation-tip';
    tip.innerHTML = 'Press <kbd>Fn</kbd> <kbd>Fn</kbd> to start dictating — macOS handles the rest. ' +
                    '(Configure the shortcut in System Settings ▸ Keyboard ▸ Dictation.)';
    const actions = composer.querySelector('.composer-actions');
    if (actions) composer.insertBefore(tip, actions);
    else composer.appendChild(tip);
  }
  requestAnimationFrame(() => tip.classList.add('visible'));
  clearTimeout(tip._fadeTimer);
  tip._fadeTimer = setTimeout(() => {
    tip.classList.remove('visible');
    setTimeout(() => { if (tip.parentNode) tip.parentNode.removeChild(tip); }, 250);
  }, 4500);
}

// ─── In-document search (⌘F) ───────────────────────────────────────────────
// Walks every text node inside the search "roots" (main content, sidebar
// threads, orphan section, and threaded comment metadata like authors/
// anchor text) and wraps matches in <mark class="search-hit">. The currently-
// selected match additionally gets .current and is scrolled into view.
//
// Settled threads that are collapsed are auto-expanded before searching so
// matches inside them are visible. Composer textareas are intentionally
// skipped — interfering with the user's in-flight typing would be worse
// than missing a match in a draft.
const SEARCH_ROOT_SELECTOR = '#content, #sidebar-threads';

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function clearSearchHighlights() {
  document.querySelectorAll('mark.search-hit').forEach(m => {
    const parent = m.parentNode;
    if (!parent) return;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
    parent.normalize();
  });
}

function highlightTextNodes(root, re) {
  // Collect candidate text nodes first (mutating during the walk corrupts the iterator).
  const NodeFilter_ = NodeFilter;
  const walker = document.createTreeWalker(root, NodeFilter_.SHOW_TEXT, {
    acceptNode(n) {
      // Skip empty / whitespace-only text.
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter_.FILTER_REJECT;
      // Skip anything inside a composer textarea or our own search highlights.
      const p = n.parentNode;
      if (!p) return NodeFilter_.FILTER_REJECT;
      if (p.closest && (p.closest('.composer') || p.closest('mark.search-hit') || p.closest('script') || p.closest('style'))) {
        return NodeFilter_.FILTER_REJECT;
      }
      return NodeFilter_.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);

  const hits = [];
  for (const tn of nodes) {
    const text = tn.nodeValue;
    re.lastIndex = 0;
    let m, last = 0;
    const frag = document.createDocumentFragment();
    let matched = false;
    while ((m = re.exec(text)) !== null) {
      matched = true;
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      hits.push(mark);
      last = m.index + m[0].length;
      if (m.index === re.lastIndex) re.lastIndex++;  // zero-width safety
    }
    if (matched) {
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    }
  }
  return hits;
}

function runSearch(query, preserveIndex) {
  clearSearchHighlights();
  const trimmed = (query || '').trim();
  const countEl = document.getElementById('search-count');
  if (!trimmed) {
    state.search = { query: '', index: 0, total: 0, hits: [] };
    if (countEl) countEl.textContent = '0/0';
    return;
  }
  // Auto-expand every settled thread so collapsed matches become visible.
  let expandedAny = false;
  document.querySelectorAll('.thread.settled.collapsed').forEach(t => {
    const root = t.getAttribute('data-root');
    if (root && !state.expandedSettled.has(root)) {
      state.expandedSettled.add(root);
      expandedAny = true;
    }
  });
  if (expandedAny) {
    // Re-render to drop the .collapsed class. After render, we'll re-enter
    // runSearch from applyState/the caller's second pass — but to avoid
    // recursion we just inline the re-render here and continue.
    render();
  }

  const re = new RegExp(escapeRegExp(trimmed), 'gi');
  const hits = [];
  document.querySelectorAll(SEARCH_ROOT_SELECTOR).forEach(root => {
    hits.push(...highlightTextNodes(root, re));
  });

  let index = 0;
  if (preserveIndex && state.search && state.search.total > 0 && hits.length > 0) {
    index = Math.min(state.search.index, hits.length - 1);
  }
  state.search = { query: trimmed, index, total: hits.length, hits };
  if (countEl) countEl.textContent = hits.length ? `${index + 1}/${hits.length}` : `0/0`;
  applyCurrentSearchHit({ scroll: !preserveIndex });
}

function applyCurrentSearchHit({ scroll }) {
  if (!state.search || !state.search.hits.length) return;
  // Hits in the DOM may have been replaced if applyState re-ran runSearch —
  // grab fresh references just in case.
  const live = Array.from(document.querySelectorAll('mark.search-hit'));
  if (!live.length) return;
  live.forEach(el => el.classList.remove('current'));
  const i = Math.max(0, Math.min(state.search.index, live.length - 1));
  const cur = live[i];
  cur.classList.add('current');
  if (scroll) cur.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function searchStep(delta) {
  if (!state.search || !state.search.total) return;
  state.search.index = (state.search.index + delta + state.search.total) % state.search.total;
  const countEl = document.getElementById('search-count');
  if (countEl) countEl.textContent = `${state.search.index + 1}/${state.search.total}`;
  applyCurrentSearchHit({ scroll: true });
}

function openSearch() {
  const bar = document.getElementById('search-bar');
  const input = document.getElementById('search-input');
  if (!bar || !input) return;
  bar.classList.add('visible');
  bar.setAttribute('aria-hidden', 'false');
  // Pre-select any existing query so the user can type to replace.
  input.focus();
  input.select();
}

function closeSearch() {
  const bar = document.getElementById('search-bar');
  if (bar) {
    bar.classList.remove('visible');
    bar.setAttribute('aria-hidden', 'true');
  }
  clearSearchHighlights();
  state.search = null;
  const countEl = document.getElementById('search-count');
  if (countEl) countEl.textContent = '0/0';
}

// Search-bar input + keyboard wiring.
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'search-input') {
    runSearch(e.target.value, /*preserveIndex=*/false);
  }
});
document.addEventListener('keydown', (e) => {
  // ⌘F (or Ctrl+F) anywhere → open the search bar.
  if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
    openSearch();
    e.preventDefault();
    return;
  }
  // Within the search input: Enter / Shift+Enter step, Esc closes.
  if (e.target && e.target.id === 'search-input') {
    if (e.key === 'Enter') {
      searchStep(e.shiftKey ? -1 : 1);
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape') {
      closeSearch();
      e.preventDefault();
      return;
    }
  }
}, true);  // capture phase so we beat the composer-textarea Escape handler.

window.hr = {
  applyState(payload) {
    // fileExt must be set BEFORE splitBlocks — splitBlocks branches on isCodeMode().
    state.fileExt = (payload.fileExt || '').toLowerCase();
    state.fileDir = payload.fileDir || '';
    state.linkDefs = collectLinkDefinitions(payload.source || '');
    state.blocks = splitBlocks(payload.source || '');
    state.comments = payload.comments || [];
    // Update the floating zoom indicator. Swift owns the authoritative value.
    if (typeof payload.pageZoom === 'number') {
      const el = document.getElementById('zoom-pct');
      if (el) el.textContent = Math.round(payload.pageZoom * 100) + '%';
    }
    render();
    // Re-apply current search (if any) to the freshly rendered DOM so the
    // user's match list and current-index survive external reloads.
    if (state.search && state.search.query) {
      runSearch(state.search.query, /*preserveIndex=*/true);
    }
    // Attention: an agent has explicitly requested the user's focus on a
    // specific comment via `human-review attention …`. Honor it once, then
    // tell Swift to clear the sidecar flag so we don't keep refocusing.
    const want = payload.pendingAttention || null;
    if (want && !state.attentionShown.has(want)) {
      state.attentionShown.add(want);
      focusComment(want);
      postSwift({ type: 'clearAttention' });
    }
    // (No auto-jump on file open — the user stays where they were. Agents
    // that want to draw attention must use `attention`.)
  },
  showOverlay,
  showOverlayError,
};

postSwift({ type: 'ready' });
</script>
</body>
</html>
