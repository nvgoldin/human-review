<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f;
    --bg: #ffffff;
    --muted: #6e6e73;
    --accent: #0a84ff;
    --hover-bg: rgba(10,132,255,0.06);
    --active-stripe: #ffaf0a;
    --settled-stripe: #b0b0b8;
    --thread-bg: #fbf7ee;
    --thread-bg-settled: #f1f1f3;
    --thread-border: #e6dfd1;
    --code-bg: #f5f5f7;
    --border: #d2d2d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --bg: #1d1d1f;
      --muted: #98989d;
      --hover-bg: rgba(10,132,255,0.14);
      --thread-bg: #322c1c;
      --thread-bg-settled: #2c2c2e;
      --thread-border: #4a4030;
      --code-bg: #2c2c2e;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 14.5px; line-height: 1.55;
    color: var(--fg); background: var(--bg);
  }
  /* Lock the viewport. The DOC scrolls inside #content (its scrollbar lives
     to the LEFT of the chat sidebar) and the SIDEBAR scrolls inside
     #sidebar-threads (its scrollbar lives at the window edge). With these
     in separate stacking regions, there's no ambiguity — wheel events
     hitting the doc scroll the doc, wheel events hitting the sidebar
     scroll the sidebar. The previous "body scrolls + sidebar overlay" mode
     stacked both scrollbars on top of each other at the same x-coord and
     made the sidebar appear unscrollable. */
  html, body { height: 100vh; overflow: hidden; }
  body { padding-right: 340px; }
  #content {
    height: 100vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 160px 64px;
  }

  /* ─── Right-side document chat sidebar ───────────────────────────────── */
  /* CSS Grid (header / fill / footer) is more reliable than flex for the
     scrollable-middle pattern — no min-height:auto trap. */
  #chat-sidebar {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 340px;
    border-left: 1px solid var(--border);
    background: var(--bg);
    /* Flex column with explicit min-height: 0 on the scroll child is the
       canonical "scrollable middle" pattern. The earlier grid approach
       (grid-template-rows: auto 1fr auto) kept letting the middle row grow
       to fit content; even minmax(0, 1fr) didn't reliably bound it in
       WKWebView. Flex with `flex: 1 1 0; min-height: 0;` on the middle is
       the textbook fix that actually works. */
    display: flex;
    flex-direction: column;
    z-index: 5;
    overscroll-behavior: contain;
  }
  #chat-sidebar > .sidebar-head { flex: 0 0 auto; }
  #chat-sidebar > #sidebar-threads { flex: 1 1 0; min-height: 0; }
  #chat-sidebar > #sidebar-composer { flex: 0 0 auto; }
  .sidebar-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .sidebar-title { font-weight: 600; font-size: 13.5px; }
  .sidebar-sub   { color: var(--muted); font-size: 11px; }

  .sidebar-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overscroll-behavior: contain;
  }
  /* Always-visible thin scrollbar so it's obvious that the sidebar scrolls
     independently of the document (the macOS default hides it until you
     interact, which is what made it look broken). */
  .sidebar-scroll::-webkit-scrollbar { width: 10px; }
  .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
  .sidebar-scroll::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 5px;
    border: 2px solid var(--bg);
  }
  .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  /* Sidebar thread cards are click-targets for reply-mode (composer at the
     bottom switches to "Reply" for that thread). flex-shrink: 0 is critical
     — without it, the flex column squashes thread cards down to a few pixels
     each instead of letting them overflow and trigger the scrollbar. */
  #sidebar-threads .thread { cursor: pointer; flex-shrink: 0; }
  #sidebar-threads .thread.replying {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* Reply banner above the global composer */
  .sidebar-reply-banner {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    margin-bottom: 6px;
    border-radius: 5px;
    background: rgba(10,132,255,0.08);
    border: 1px solid rgba(10,132,255,0.25);
    font-size: 11.5px;
    color: var(--fg);
  }
  .sidebar-reply-banner .snippet {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
  }
  .sidebar-reply-banner button {
    background: transparent; border: none; cursor: pointer;
    color: var(--muted); padding: 0 4px; font-size: 13px;
  }
  .sidebar-empty {
    margin: 12px;
    padding: 14px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }
  .composer-global {
    border-top: 1px solid var(--border);
    border-radius: 0;
    background: var(--bg);
  }

  /* ─── Cross-link overlay ─────────────────────────────────────────────── */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
  }
  #overlay.visible { display: block; }
  .overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
  }
  .overlay-card {
    position: relative;
    margin: 5vh auto 0;
    background: var(--bg);
    border-radius: 12px;
    max-width: 760px;
    width: min(92vw, 760px);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .overlay-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--code-bg);
  }
  .overlay-path {
    flex: 1;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .overlay-btn {
    font: inherit; font-size: 12px;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .overlay-btn.close { padding: 4px 8px; }
  .overlay-btn:hover { background: rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    .overlay-btn:hover { background: rgba(255,255,255,0.08); }
  }
  .overlay-body {
    padding: 16px 22px 24px;
    overflow-y: auto;
    max-height: calc(85vh - 50px);
  }
  .overlay-body h1, .overlay-body h2, .overlay-body h3 { margin-top: 0.6em; }
  .overlay-empty {
    padding: 14px;
    color: var(--muted);
    font-style: italic;
  }

  .block {
    position: relative;
    padding: 6px 10px;
    margin: 4px -10px;
    border-radius: 6px;
  }
  .block:hover { background: var(--hover-bg); }
  .block.focused {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--hover-bg);
  }
  .block.focused > .add-btn { opacity: 1; pointer-events: auto; }
  .block::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -44px; width: 44px;
  }

  .block-body > :first-child { margin-top: 0; }
  .block-body > :last-child { margin-bottom: 0; }

  .add-btn {
    position: absolute;
    left: -38px; top: 4px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 16px; font-weight: 600;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center; justify-content: center;
    user-select: none;
    padding: 0;
    transition: opacity 0.1s ease-out, transform 0.08s ease-out;
  }
  .block:hover > .add-btn,
  .add-btn:hover,
  .add-btn:focus { opacity: 1; pointer-events: auto; }
  .add-btn:hover { transform: scale(1.08); }
  .add-btn:active { transform: scale(0.95); }
  .block.has-active > .add-btn {
    background: var(--active-stripe);
    color: #1d1d1f;
    opacity: 1;
    pointer-events: auto;
  }

  /* Flag-block pulse animation (lands here after n/N navigation) */
  @keyframes flag-pulse {
    0%, 100% { box-shadow: none; }
    35%      { box-shadow: 0 0 0 4px rgba(255,175,10,0.55); }
  }
  .block.pulse { animation: flag-pulse 0.6s ease-out; }

  /* Threads */
  .threads { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }

  .thread {
    border-left: 3px solid var(--active-stripe);
    background: var(--thread-bg);
    border-radius: 6px;
    overflow: hidden;
  }
  .thread.settled {
    border-left-color: var(--settled-stripe);
    background: var(--thread-bg-settled);
    opacity: 0.85;
  }
  /* n/N focus + landing pulse for sidebar threads */
  .thread.focused-sidebar {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  @keyframes thread-pulse {
    0%, 100% { box-shadow: none; }
    35%      { box-shadow: 0 0 0 4px rgba(10,132,255,0.45); }
  }
  .thread.pulse-thread { animation: thread-pulse 0.6s ease-out; }

  .thread-head {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--thread-border);
  }
  .thread.settled .thread-head { cursor: pointer; }
  .thread-head .line {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    background: var(--accent); color: white;
    padding: 1px 6px; border-radius: 3px;
  }
  .thread-head .status {
    font-weight: 600;
  }
  .thread-head .status.active { color: #b75d00; }
  .thread-head .status.settled { color: var(--muted); }
  .thread-head .count {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .thread-head .spacer { flex: 1; }
  .thread-head button {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    cursor: pointer; font-size: 11px; padding: 2px 8px;
    border-radius: 3px;
  }
  .thread-head button:hover { background: rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    .thread-head button:hover { background: rgba(255,255,255,0.08); }
  }

  .thread-body { display: block; }
  .thread.collapsed .thread-body { display: none; }

  .comment {
    padding: 8px 12px;
    border-bottom: 1px solid var(--thread-border);
  }
  .comment:last-child { border-bottom: none; }
  .comment.is-agent { background: rgba(10,132,255,0.05); }
  .comment-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 4px;
  }
  .comment-head .author { color: var(--fg); font-weight: 600; font-size: 12px; }
  .comment.is-agent .comment-head .author::before { content: "🤖 "; }
  .comment-head .reply-marker {
    color: var(--muted);
    font-size: 11px;
  }
  .comment-head .spacer { flex: 1; }
  .comment-head button {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 11px; padding: 2px 6px;
    border-radius: 3px;
  }
  .comment-head button:hover { background: rgba(0,0,0,0.06); color: var(--fg); }
  @media (prefers-color-scheme: dark) {
    .comment-head button:hover { background: rgba(255,255,255,0.08); }
  }
  .comment-body {
    font-size: 13.5px;
    word-wrap: break-word;
  }
  /* Rendered markdown inside a comment — tight margins so it reads as a chat bubble */
  .comment-body > :first-child { margin-top: 0; }
  .comment-body > :last-child  { margin-bottom: 0; }
  .comment-body p { margin: 0.3em 0; }
  .comment-body ul, .comment-body ol { padding-left: 1.4em; margin: 0.3em 0; }
  .comment-body li { margin: 0.1em 0; }
  .comment-body code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .comment-body pre { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 0.4em 0; }
  .comment-body pre code { background: transparent; padding: 0; font-size: 0.85em; }
  .comment-body blockquote { margin: 0.3em 0; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
  .comment-body h1, .comment-body h2, .comment-body h3 { font-size: 1.05em; margin: 0.4em 0 0.2em; border: none; padding: 0; }

  /* Read receipts — WhatsApp-style.
       ✓   delivered (always shown the moment a comment exists)
       ✓✓  read by at least one non-author
     Smooth animated transition from one to the other via the `.read` class.
     Hover the icon for the list of readers. */
  .read-receipt {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 4px;
    height: 16px;
    line-height: 1;
    cursor: default;
  }
  .read-receipt .check {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    transition: color 0.35s ease;
  }
  .read-receipt .check-2 {
    margin-left: -5px;
    opacity: 0;
    transform: translateX(-3px);
    transition: opacity 0.32s cubic-bezier(0.2,0.7,0.4,1) 0.05s,
                transform 0.32s cubic-bezier(0.2,0.7,0.4,1) 0.05s,
                color 0.35s ease;
  }
  .read-receipt.read .check { color: #0a84ff; }
  .read-receipt.read .check-2 {
    opacity: 1;
    transform: translateX(0);
  }

  /* Composer */
  .composer {
    padding: 10px 12px;
    border-top: 1px solid var(--thread-border);
  }
  .composer textarea {
    width: 100%;
    min-height: 60px;
    font: inherit;
    font-size: 13.5px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    resize: vertical;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .composer-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    align-items: center;
    margin-top: 6px;
  }
  .composer-actions .hint {
    flex: 1;
    font-size: 11px; color: var(--muted);
  }
  .composer-actions button {
    font: inherit; font-size: 13px;
    padding: 4px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .composer-actions button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  /* Microphone (dictation) button — compact icon style, sits left of Cancel. */
  .composer-actions button.mic {
    padding: 2px 6px;
    font-size: 14px;
    line-height: 1;
    background: transparent;
    border: 1px solid var(--border);
    margin-right: auto;          /* push the rest (Cancel, primary) to the right */
  }
  .composer-actions button.mic:hover { background: var(--hover-bg); }
  .composer-actions button.mic.flash {
    background: rgba(255,175,10,0.35);
    border-color: var(--active-stripe);
  }
  /* Transient inline tip shown right above the composer actions when the
     user clicks the 🎤 button. Fades out after a few seconds. */
  .composer .dictation-tip {
    font-size: 11.5px;
    color: var(--fg);
    background: rgba(255,175,10,0.15);
    border: 1px solid rgba(255,175,10,0.45);
    border-radius: 5px;
    padding: 4px 8px;
    margin: 4px 0;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .composer .dictation-tip.visible { opacity: 1; }
  .composer .dictation-tip kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    padding: 1px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  /* Orphaned section */
  .orphan-section { margin-top: 40px; }
  .orphan-title {
    font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px; margin-bottom: 10px;
  }

  /* Markdown content */
  h1, h2, h3, h4, h5, h6 { margin: 1em 0 0.4em; line-height: 1.25; }
  h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  h3 { font-size: 1.2em; }
  p { margin: 0.5em 0; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  pre code { background: transparent; padding: 0; font-size: 0.88em; }
  blockquote { margin: 0.5em 0; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--muted); }
  table { border-collapse: collapse; margin: 0.5em 0; }
  table th, table td { border: 1px solid var(--border); padding: 6px 10px; }
  ul, ol { padding-left: 1.6em; margin: 0.4em 0; }
  li { margin: 0.15em 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }

  /* Mermaid diagram rendering — supplants <pre><code class="language-mermaid"> blocks. */
  .mermaid-block {
    margin: 0.8em 0;
    padding: 8px;
    border-radius: 8px;
    background: var(--code-bg);
    overflow-x: auto;
    text-align: center;
  }
  .mermaid-block svg {
    max-width: 100%;
    height: auto;
    display: inline-block;
  }
  .mermaid-error {
    margin: 0.8em 0;
    padding: 10px 12px;
    border: 1px solid rgba(255,69,58,0.5);
    background: rgba(255,69,58,0.10);
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: #c0392b;
    white-space: pre-wrap;
  }
  /* Diagram zoom overlay — reuses the cross-link overlay container */
  .diagram-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--code-bg);
    user-select: none;
  }
  .diagram-btn {
    font: inherit; font-size: 13px;
    min-width: 32px;
    padding: 3px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .diagram-btn:hover { background: rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    .diagram-btn:hover { background: rgba(255,255,255,0.08); }
  }
  .diagram-zoom-label {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    min-width: 56px;
    text-align: center;
    color: var(--muted);
  }
  .diagram-hint {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
  }
  .diagram-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 70vh;
    overflow: hidden;
    user-select: none;
    cursor: grab;
    background:
      linear-gradient(45deg, var(--code-bg) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg, var(--code-bg) 25%, transparent 25%) 0 8px/16px 16px,
      linear-gradient(45deg, transparent 75%, var(--code-bg) 75%) 8px -8px/16px 16px,
      linear-gradient(-45deg, transparent 75%, var(--code-bg) 75%) -8px 0/16px 16px;
  }
  .diagram-stage:active { cursor: grabbing; }
  .diagram-stage svg {
    transform-origin: center center;
    max-width: none !important;   /* override marked.parse defaults so we can zoom past container */
    max-height: none !important;
  }
  @media (prefers-color-scheme: dark) {
    .mermaid-error { color: #ff6b5e; }
  }

  /* ─── Code-mode (.py, .txt, .js, …) — per-line GitHub-style review ──── */
  /* Tighter content frame: code lines look better in a narrower column. */
  body.code-mode #content {
    max-width: 1100px;
    padding: 18px 14px 160px 24px;
  }
  /* Each line is one .block. CSS Grid: gutter (line number) | code column.
     minmax(0, 1fr) lets the code column shrink — without the 0 floor, `1fr`
     is implicitly `minmax(auto, 1fr)` and the column refuses to go below its
     min-content width, which combined with `word-break: break-word` made
     long lines wrap character-by-character into a sliver of a column. */
  body.code-mode .block {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr);
    align-items: start;
    /* Override the markdown-mode .block padding/margin/radius/hover — code
       lines have their own tight rhythm and a left-edge thread indicator. */
    margin: 0;
    padding: 0;
    border-left: 3px solid transparent;
    border-radius: 0;
    background: transparent;
  }
  body.code-mode .block:hover { background: var(--hover-bg); }
  body.code-mode .block.has-active { border-left-color: var(--active-stripe); }
  body.code-mode .block.has-threads:not(.has-active) { border-left-color: var(--settled-stripe); }
  body.code-mode .block.focused {

<script src="marked.min.js"></script>
<script src="mermaid.min.js"></script>
<script src="highlight.min.js"></script>
<script>
  // Configure marked once. `breaks: true` makes single newlines render as <br>,
  // which is what chat-style comment bodies expect. `gfm: true` enables tables,
  // task lists, fenced code blocks, autolinks.
  if (window.marked && window.marked.setOptions) {
    marked.setOptions({ breaks: true, gfm: true });
  }
  // Mermaid diagrams in ```mermaid fenced blocks. We disable startOnLoad —
  // we'll call mermaid.run() / mermaid.render() ourselves after every marked
  // pass so dynamic re-renders (auto-reload, navigation) all pick up diagrams.
  if (window.mermaid && mermaid.initialize) {
    const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: darkMode ? 'dark' : 'default',
      securityLevel: 'loose',          // allow click handlers, etc. — local trust
      // Prevent mermaid from injecting its "Syntax error in text" SVG anywhere
      // outside the container we hand to render(). We surface errors inline
      // via renderMermaidIn's catch block instead.
      suppressErrorRendering: true,
      flowchart: { useMaxWidth: true },
      sequence: { useMaxWidth: true },
    });
  }
</script>

<body>

<!-- Search overlay (hidden until ⌘F). Lives outside #content so it's not
     wiped on re-renders. -->
<div id="search-bar" role="search" aria-hidden="true">
  <input type="text" id="search-input" placeholder="Find in this document…" autocomplete="off" spellcheck="false">
  <span class="count" id="search-count">0/0</span>
  <button data-action="search-prev" title="Previous match (⇧↩)">↑</button>
  <button data-action="search-next" title="Next match (↩)">↓</button>

</div>

<!-- Floating zoom widget. Mirrors ⌘+ / ⌘- / ⌘0. -->

<div id="content"></div>

<!-- Right-side document chat for scope=global threads. Always visible; the
     composer is pinned at the bottom. -->
<aside id="chat-sidebar">
  <header class="sidebar-head">

    <span class="sidebar-sub" id="sidebar-summary"></span>

      <span class="hint">Tab / ⌘Enter to send</span>
      <button class="mic" data-action="start-dictation" title="Dictate (Fn-Fn)" aria-label="Dictate">🎤</button>
      <button class="primary" data-action="submit-global">Send</button>
    </div>

<!-- Cross-link overlay (hidden until window.hr.showOverlay is called) -->

      <button class="overlay-btn close" data-action="overlay-close" aria-label="Close">✕</button>
