<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f;
    --bg: #ffffff;
    --muted: #6e6e73;
    --accent: #0a84ff;
    --hover-bg: rgba(10,132,255,0.06);
    --active-stripe: #ffaf0a;
    --settled-stripe: #b0b0b8;
    --thread-bg: #fbf7ee;
    --thread-bg-settled: #f1f1f3;
    --thread-border: #e6dfd1;
    --code-bg: #f5f5f7;
    --border: #d2d2d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --bg: #1d1d1f;
      --muted: #98989d;
      --hover-bg: rgba(10,132,255,0.14);
      --thread-bg: #322c1c;
      --thread-bg-settled: #2c2c2e;
      --thread-border: #4a4030;
      --code-bg: #2c2c2e;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 14.5px; line-height: 1.55;
    color: var(--fg); background: var(--bg);
  }
  /* Reserve the right edge for the chat sidebar so #content doesn't sit under it. */
  body { padding-right: 340px; }
  #content { max-width: 820px; margin: 0 auto; padding: 32px 24px 160px 64px; }

  /* ─── Right-side document chat sidebar ───────────────────────────────── */
  #chat-sidebar {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 340px;
    border-left: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .sidebar-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .sidebar-title { font-weight: 600; font-size: 13.5px; }
  .sidebar-sub   { color: var(--muted); font-size: 11px; }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sidebar-empty {
    margin: 12px;
    padding: 14px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }
  .composer-global {
    border-top: 1px solid var(--border);
    border-radius: 0;
    background: var(--bg);
  }

  /* ─── Cross-link overlay ─────────────────────────────────────────────── */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
  }
  #overlay.visible { display: block; }
  .overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
  }
  .overlay-card {
    position: relative;
    margin: 5vh auto 0;
    background: var(--bg);
    border-radius: 12px;
    max-width: 760px;
    width: min(92vw, 760px);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .overlay-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--code-bg);
  }
  .overlay-path {
    flex: 1;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .overlay-btn {
    font: inherit; font-size: 12px;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .overlay-btn.close { padding: 4px 8px; }
  .overlay-btn:hover { background: rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    .overlay-btn:hover { background: rgba(255,255,255,0.08); }
  }
  .overlay-body {
    padding: 16px 22px 24px;
    overflow-y: auto;
    max-height: calc(85vh - 50px);
  }
  .overlay-body h1, .overlay-body h2, .overlay-body h3 { margin-top: 0.6em; }
  .overlay-empty {
    padding: 14px;
    color: var(--muted);
    font-style: italic;
  }

  .block {
    position: relative;
    padding: 6px 10px;
    margin: 4px -10px;
    border-radius: 6px;
  }
  .block:hover { background: var(--hover-bg); }
  .block.focused {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: var(--hover-bg);
  }
  .block.focused > .add-btn { opacity: 1; pointer-events: auto; }
  .block::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -44px; width: 44px;
  }

  .block-body > :first-child { margin-top: 0; }
  .block-body > :last-child { margin-bottom: 0; }

  .add-btn {
    position: absolute;
    left: -38px; top: 4px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 16px; font-weight: 600;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center; justify-content: center;
    user-select: none;
    padding: 0;
    transition: opacity 0.1s ease-out, transform 0.08s ease-out;
  }
  .block:hover > .add-btn,
  .add-btn:hover,
  .add-btn:focus { opacity: 1; pointer-events: auto; }
  .add-btn:hover { transform: scale(1.08); }
  .add-btn:active { transform: scale(0.95); }
  .block.has-active > .add-btn {
    background: var(--active-stripe);
    color: #1d1d1f;
    opacity: 1;
    pointer-events: auto;
  }

  /* Flag-block pulse animation (lands here after n/N navigation) */
  @keyframes flag-pulse {
    0%, 100% { box-shadow: none; }
    35%      { box-shadow: 0 0 0 4px rgba(255,175,10,0.55); }
  }
  .block.pulse { animation: flag-pulse 0.6s ease-out; }

  /* Threads */
  .threads { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }

  .thread {
    border-left: 3px solid var(--active-stripe);
    background: var(--thread-bg);
    border-radius: 6px;
    overflow: hidden;
  }
  .thread.settled {
    border-left-color: var(--settled-stripe);
    background: var(--thread-bg-settled);
    opacity: 0.85;
  }
  /* n/N focus + landing pulse for sidebar threads */
  .thread.focused-sidebar {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  @keyframes thread-pulse {
    0%, 100% { box-shadow: none; }
    35%      { box-shadow: 0 0 0 4px rgba(10,132,255,0.45); }
  }
  .thread.pulse-thread { animation: thread-pulse 0.6s ease-out; }

  .thread-head {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--thread-border);
  }
  .thread.settled .thread-head { cursor: pointer; }
  .thread-head .line {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    background: var(--accent); color: white;
    padding: 1px 6px; border-radius: 3px;
  }
  .thread-head .status {
    font-weight: 600;
  }
  .thread-head .status.active { color: #b75d00; }
  .thread-head .status.settled { color: var(--muted); }
  .thread-head .count {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .thread-head .spacer { flex: 1; }
  .thread-head button {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    cursor: pointer; font-size: 11px; padding: 2px 8px;
    border-radius: 3px;
  }
  .thread-head button:hover { background: rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    .thread-head button:hover { background: rgba(255,255,255,0.08); }
  }

  .thread-body { display: block; }
  .thread.collapsed .thread-body { display: none; }

  .comment {
    padding: 8px 12px;
    border-bottom: 1px solid var(--thread-border);
  }
  .comment:last-child { border-bottom: none; }
  .comment.is-agent { background: rgba(10,132,255,0.05); }
  .comment-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 4px;
  }
  .comment-head .author { color: var(--fg); font-weight: 600; font-size: 12px; }
  .comment.is-agent .comment-head .author::before { content: "🤖 "; }
  .comment-head .reply-marker {
    color: var(--muted);
    font-size: 11px;
  }
  .comment-head .spacer { flex: 1; }
  .comment-head button {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 11px; padding: 2px 6px;
    border-radius: 3px;
  }
  .comment-head button:hover { background: rgba(0,0,0,0.06); color: var(--fg); }
  @media (prefers-color-scheme: dark) {
    .comment-head button:hover { background: rgba(255,255,255,0.08); }
  }
  .comment-body {
    font-size: 13.5px;
    word-wrap: break-word;
  }
  /* Rendered markdown inside a comment — tight margins so it reads as a chat bubble */
  .comment-body > :first-child { margin-top: 0; }
  .comment-body > :last-child  { margin-bottom: 0; }
  .comment-body p { margin: 0.3em 0; }
  .comment-body ul, .comment-body ol { padding-left: 1.4em; margin: 0.3em 0; }
  .comment-body li { margin: 0.1em 0; }
  .comment-body code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .comment-body pre { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 0.4em 0; }
  .comment-body pre code { background: transparent; padding: 0; font-size: 0.85em; }
  .comment-body blockquote { margin: 0.3em 0; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
  .comment-body h1, .comment-body h2, .comment-body h3 { font-size: 1.05em; margin: 0.4em 0 0.2em; border: none; padding: 0; }

  /* Read receipts — WhatsApp-style.
       ✓   delivered (always shown the moment a comment exists)
       ✓✓  read by at least one non-author
     Smooth animated transition from one to the other via the `.read` class.
     Hover the icon for the list of readers. */
  .read-receipt {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 4px;
    height: 16px;
    line-height: 1;
    cursor: default;
  }
  .read-receipt .check {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    transition: color 0.35s ease;
  }
  .read-receipt .check-2 {
    margin-left: -5px;
    opacity: 0;
    transform: translateX(-3px);
    transition: opacity 0.32s cubic-bezier(0.2,0.7,0.4,1) 0.05s,
                transform 0.32s cubic-bezier(0.2,0.7,0.4,1) 0.05s,
                color 0.35s ease;
  }
  .read-receipt.read .check { color: #0a84ff; }
  .read-receipt.read .check-2 {
    opacity: 1;
    transform: translateX(0);
  }

  /* Composer */
  .composer {
    padding: 10px 12px;
    border-top: 1px solid var(--thread-border);
  }
  .composer textarea {
    width: 100%;
    min-height: 60px;
    font: inherit;
    font-size: 13.5px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    resize: vertical;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .composer-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    align-items: center;
    margin-top: 6px;
  }
  .composer-actions .hint {
    flex: 1;
    font-size: 11px; color: var(--muted);
  }
  .composer-actions button {
    font: inherit; font-size: 13px;
    padding: 4px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .composer-actions button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* Orphaned section */
  .orphan-section { margin-top: 40px; }
  .orphan-title {
    font-size: 13px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px; margin-bottom: 10px;
  }

  /* Markdown content */
  h1, h2, h3, h4, h5, h6 { margin: 1em 0 0.4em; line-height: 1.25; }
  h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  h3 { font-size: 1.2em; }
  p { margin: 0.5em 0; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  pre code { background: transparent; padding: 0; font-size: 0.88em; }
  blockquote { margin: 0.5em 0; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--muted); }
  table { border-collapse: collapse; margin: 0.5em 0; }
  table th, table td { border: 1px solid var(--border); padding: 6px 10px; }
  ul, ol { padding-left: 1.6em; margin: 0.4em 0; }
  li { margin: 0.15em 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }

  /* Mermaid diagram rendering — supplants <pre><code class="language-mermaid"> blocks. */
  .mermaid-block {
    margin: 0.8em 0;
    padding: 8px;
    border-radius: 8px;
    background: var(--code-bg);
    overflow-x: auto;
    text-align: center;
  }
  .mermaid-block svg {
    max-width: 100%;
    height: auto;
    display: inline-block;
  }
  .mermaid-error {
    margin: 0.8em 0;
    padding: 10px 12px;
    border: 1px solid rgba(255,69,58,0.5);
    background: rgba(255,69,58,0.10);
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: #c0392b;
    white-space: pre-wrap;
  }
  @media (prefers-color-scheme: dark) {
    .mermaid-error { color: #ff6b5e; }
  }
</style>
<script src="marked.min.js"></script>
<script src="mermaid.min.js"></script>
<script>
  // Configure marked once. `breaks: true` makes single newlines render as <br>,
  // which is what chat-style comment bodies expect. `gfm: true` enables tables,
  // task lists, fenced code blocks, autolinks.
  if (window.marked && window.marked.setOptions) {
    marked.setOptions({ breaks: true, gfm: true });
  }
  // Mermaid diagrams in ```mermaid fenced blocks. We disable startOnLoad —
  // we'll call mermaid.run() / mermaid.render() ourselves after every marked
  // pass so dynamic re-renders (auto-reload, navigation) all pick up diagrams.
  if (window.mermaid && mermaid.initialize) {
    const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: darkMode ? 'dark' : 'default',
      securityLevel: 'loose',          // allow click handlers, etc. — local trust
      // Prevent mermaid from injecting its "Syntax error in text" SVG anywhere
      // outside the container we hand to render(). We surface errors inline
      // via renderMermaidIn's catch block instead.
      suppressErrorRendering: true,
      flowchart: { useMaxWidth: true },
      sequence: { useMaxWidth: true },
    });
  }
</script>
</head>
<body>
<div id="content"></div>

<!-- Right-side document chat for scope=global threads. Always visible; the
     composer is pinned at the bottom. -->
<aside id="chat-sidebar">
  <header class="sidebar-head">
    <span class="sidebar-title">Document chat</span>
    <span class="sidebar-sub" id="sidebar-summary"></span>
  </header>
  <div id="sidebar-threads" class="sidebar-scroll"></div>
  <div id="sidebar-composer" class="composer composer-global">
    <textarea placeholder="Send a message about this document…"></textarea>
    <div class="composer-actions">
      <span class="hint">Tab / ⌘Enter to send</span>
      <button class="primary" data-action="submit-global">Send</button>
    </div>
  </div>
</aside>

<!-- Cross-link overlay (hidden until window.hr.showOverlay is called) -->
<div id="overlay" aria-hidden="true">
  <div class="overlay-backdrop" data-action="overlay-close"></div>
  <div class="overlay-card">
    <div class="overlay-head">
      <span class="overlay-path" id="overlay-path"></span>
      <button class="overlay-btn" data-action="overlay-open-in-review">Open in review</button>
      <button class="overlay-btn close" data-action="overlay-close" aria-label="Close">✕</button>
    </div>
    <div class="overlay-body" id="overlay-body"></div>
  </div>
</div>

<script>
'use strict';

const state = {
  blocks: [],            // [{start, text}]
  comments: [],          // flat list from Swift
  newComposerBlock: null,  // line of block where the user is composing a NEW thread
  replyComposerRoot: null, // root id of thread the user is replying to
  focusedBlock: null,
  focusedSidebarThread: null,  // root id of focused sidebar (scope=global) thread
  expandedSettled: new Set(),  // root ids of settled threads the user has expanded
  initialJumpDone: false,      // we auto-focus the first active thread on file open
  overlay: null,               // {path, fragment} when overlay is open
};

// Tracks the read state we last applied per comment id. Used to decide whether
// a comment's ✓ → ✓✓ transition should animate (newly-read) or appear instantly
// (already known to be read at last render).
const lastRenderedReadState = new Map();

// ─── parsing source into blocks ────────────────────────────────────────────────
function splitBlocks(src) {
  const lines = src.split('\n');
  const blocks = [];
  let cur = [], curStart = 0;
  let inFence = false, fenceMarker = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const m = line.match(/^(\s*)(```+|~~~+)/);
    if (m) {
      if (!inFence) { inFence = true; fenceMarker = m[2]; }
      else if (line.includes(fenceMarker)) { inFence = false; }
    }
    const blank = line.trim() === '';
    if (blank && !inFence) {
      if (cur.length) { blocks.push({ start: curStart, text: cur.join('\n') }); cur = []; }
      curStart = i + 1;
    } else {
      if (cur.length === 0) curStart = i;
      cur.push(line);
    }
  }
  if (cur.length) blocks.push({ start: curStart, text: cur.join('\n') });
  return blocks;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// ─── Mermaid post-processor ────────────────────────────────────────────────
// Marked renders ```mermaid fenced blocks as <pre><code class="language-mermaid">.
// After every render we walk those, ask mermaid to produce SVG, and swap them
// in. Errors render as a small inline diagnostic so the user sees what broke.
let _mmidCounter = 0;
async function renderMermaidIn(root) {
  if (!root || !window.mermaid || !mermaid.render) return;
  const blocks = root.querySelectorAll('pre > code.language-mermaid');
  if (blocks.length === 0) return;
  for (const code of blocks) {
    const src = code.textContent || '';
    const id = `mmid-${Date.now()}-${++_mmidCounter}`;
    const pre = code.parentElement;
    if (!pre) continue;
    try {
      const { svg } = await mermaid.render(id, src);
      const wrap = document.createElement('div');
      wrap.className = 'mermaid-block';
      wrap.innerHTML = svg;
      pre.replaceWith(wrap);
    } catch (e) {
      const err = document.createElement('div');
      err.className = 'mermaid-error';
      err.textContent = `mermaid render error:\n${(e && e.message) || e}\n\n--- source ---\n${src}`;
      pre.replaceWith(err);
    } finally {
      // Defensive cleanup: mermaid v11 sometimes leaves stray elements pinned
      // to document.body (an "iframe" sandbox for parsing, or its own error
      // SVG when suppressErrorRendering isn't honored). Sweep them.
      cleanupMermaidStrays();
    }
  }
}

function cleanupMermaidStrays() {
  // Remove any temp containers mermaid leaves on the body.
  document.body.querySelectorAll(
    'div[id^="dmmid-"], iframe[id^="iframemmid-"], svg[aria-roledescription="error"]'
  ).forEach(el => {
    if (el.parentElement === document.body) el.remove();
  });
  // Mermaid v11 in some failure modes appends a Syntax-error SVG directly
  // to <body>; identify it by its 'error-icon' class.
  document.body.querySelectorAll('svg.error').forEach(el => {
    if (el.parentElement === document.body) el.remove();
  });
}

// ─── thread grouping ───────────────────────────────────────────────────────────
function byId() {
  const m = new Map();
  for (const c of state.comments) m.set(c.id, c);
  return m;
}

function rootOf(c, idx) {
  let cur = c, safety = 0;
  while (cur && cur.replyTo && safety++ < 1000) {
    cur = idx.get(cur.replyTo) || null;
  }
  return cur;
}

function buildThreads() {
  // Returns: rootId -> { root, comments: [chronological list including root] }
  const idx = byId();
  const threads = new Map();
  for (const c of state.comments) {
    const r = rootOf(c, idx);
    if (!r) continue;  // orphan-of-tree: replyTo points to nothing
    if (!threads.has(r.id)) threads.set(r.id, { root: r, comments: [] });
    threads.get(r.id).comments.push(c);
  }
  for (const t of threads.values()) {
    t.comments.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  }
  return threads;
}

function threadsForBlock(line, threads) {
  // Only block-scoped, non-orphan threads anchored to this line.
  const result = [];
  for (const t of threads.values()) {
    if (t.root.scope !== 'block') continue;
    if (t.root.anchorLine === line && !t.root.orphaned) result.push(t);
  }
  return result.sort((a, b) => new Date(a.root.createdAt) - new Date(b.root.createdAt));
}

function activeThreadLines(threads) {
  const lines = new Set();
  for (const t of threads.values()) {
    if (t.root.scope !== 'block') continue;
    if (!t.root.resolved && !t.root.orphaned) lines.add(t.root.anchorLine);
  }
  return Array.from(lines).sort((a, b) => a - b);
}

function globalThreads(threads) {
  return Array.from(threads.values())
    .filter(t => t.root.scope === 'global')
    .sort((a, b) => new Date(a.root.createdAt) - new Date(b.root.createdAt));
}

function activeGlobalThreadIds(threads) {
  return globalThreads(threads)
    .filter(t => !t.root.resolved)
    .map(t => t.root.id);
}

// ─── messaging swift ───────────────────────────────────────────────────────────
function postSwift(payload) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.swift) {
    window.webkit.messageHandlers.swift.postMessage(payload);
  }
}

// ─── rendering ────────────────────────────────────────────────────────────────
function renderComment(c, idx) {
  const dt = new Date(c.createdAt);
  const date = dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const time = dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const isAgent = (c.author || '').toLowerCase() === 'agent';
  const isReply = !!c.replyTo;
  const readers = Array.isArray(c.readBy) ? c.readBy : [];
  const isRead = readers.length > 0;
  const tooltip = isRead ? `read by ${readers.join(', ')}` : 'delivered';
  // Render WITHOUT .read class — the post-render hook adds it (synchronously
  // for already-known-read comments → no animation; via rAF for newly-read
  // comments → smooth transition).
  const receipt = `
    <div class="read-receipt" data-cid="${escapeHtml(c.id)}" data-read="${isRead ? '1' : '0'}" title="${escapeHtml(tooltip)}">
      <span class="check">✓</span><span class="check check-2">✓</span>
    </div>
  `;
  const bodyHtml = (window.marked && marked.parse) ? marked.parse(c.body || '') : escapeHtml(c.body || '');
  return `
    <div class="comment ${isAgent ? 'is-agent' : ''}" data-id="${escapeHtml(c.id)}">
      <div class="comment-head">
        <span class="author">${escapeHtml(c.author)}</span>
        ${isReply ? '<span class="reply-marker">↪ reply</span>' : ''}
        <span>${date} ${time}</span>
        <span class="spacer"></span>
        <button data-action="delete-comment" data-id="${escapeHtml(c.id)}">Delete</button>
      </div>
      <div class="comment-body">${bodyHtml}</div>
      ${receipt}
    </div>
  `;
}

function renderComposer({ placeholder, primaryLabel, action, dataAttrs, hint }) {
  const attrs = Object.entries(dataAttrs || {})
    .map(([k, v]) => `data-${k}="${escapeHtml(String(v))}"`).join(' ');
  return `
    <div class="composer" ${attrs}>
      <textarea placeholder="${escapeHtml(placeholder)}" autofocus></textarea>
      <div class="composer-actions">
        <span class="hint">${escapeHtml(hint || '')}</span>
        <button data-action="cancel">Cancel</button>
        <button class="primary" data-action="${action}" ${attrs}>${escapeHtml(primaryLabel)}</button>
      </div>
    </div>
  `;
}

function renderThread(t) {
  const settled = t.root.resolved;
  const expanded = !settled || state.expandedSettled.has(t.root.id);
  const replyOpen = state.replyComposerRoot === t.root.id;
  const count = t.comments.length;
  const focusedSidebar = (t.root.scope === 'global' && state.focusedSidebarThread === t.root.id);

  let html = `<div class="thread ${settled ? 'settled' : ''} ${settled && !expanded ? 'collapsed' : ''} ${focusedSidebar ? 'focused-sidebar' : ''}"
                   data-root="${escapeHtml(t.root.id)}">`;
  // Head
  html += `<div class="thread-head" data-action="${settled ? 'toggle-thread' : ''}" data-root="${escapeHtml(t.root.id)}">
    <span class="line">L${t.root.anchorLine + 1}</span>
    <span class="status ${settled ? 'settled' : 'active'}">
      ${settled ? '✓ Resolved' : '● Active'}
    </span>
    <span class="count">${count} ${count === 1 ? 'msg' : 'msgs'}</span>
    <span class="spacer"></span>
    ${settled
      ? `<button data-action="reopen-thread" data-root="${escapeHtml(t.root.id)}">Reopen</button>`
      : `<button data-action="resolve-thread" data-root="${escapeHtml(t.root.id)}">Resolve</button>`
    }
  </div>`;

  // Body
  html += `<div class="thread-body">`;
  for (const c of t.comments) html += renderComment(c);
  if (!settled || replyOpen) {
    html += renderComposer({
      placeholder: settled ? 'Reply (will re-open this thread)…' : 'Reply to this thread…',
      primaryLabel: settled ? 'Reply & reopen' : 'Reply',
      action: 'submit-reply',
      dataAttrs: { root: t.root.id },
      hint: 'Tab to submit · Esc to cancel'
    });
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

function render() {
  const scrollY = window.scrollY;
  const container = document.getElementById('content');
  const frag = document.createDocumentFragment();
  const threads = buildThreads();

  for (const b of state.blocks) {
    const div = document.createElement('div');
    const blockThreads = threadsForBlock(b.start, threads);
    const hasActive = blockThreads.some(t => !t.root.resolved);
    const classes = ['block'];
    if (blockThreads.length) classes.push('has-threads');
    if (hasActive) classes.push('has-active');
    if (state.focusedBlock === b.start) classes.push('focused');
    div.className = classes.join(' ');
    div.setAttribute('data-line', String(b.start));

    let threadsHtml = '';
    if (blockThreads.length) {
      threadsHtml = '<div class="threads">';
      for (const t of blockThreads) threadsHtml += renderThread(t);
      threadsHtml += '</div>';
    }
    const newComposerHtml = state.newComposerBlock === b.start ? renderComposer({
      placeholder: 'Start a new thread on this block…',
      primaryLabel: 'Comment',
      action: 'submit-new',
      dataAttrs: { line: b.start, text: b.text },
      hint: 'Tab to submit · Esc to cancel'
    }) : '';

    div.innerHTML = `
      <button class="add-btn" data-action="open-new" data-line="${b.start}" data-text="${escapeHtml(b.text)}" title="New thread">+</button>
      <div class="block-body">${marked.parse(b.text)}</div>
      ${threadsHtml}
      ${newComposerHtml}
    `;
    frag.appendChild(div);
  }

  // Orphaned threads — comments whose root.orphaned=true
  const orphanRoots = Array.from(threads.values()).filter(t => t.root.orphaned);
  if (orphanRoots.length) {
    const sec = document.createElement('div');
    sec.className = 'orphan-section';
    sec.innerHTML = `<h3 class="orphan-title">⚠ Orphaned threads (anchor text gone from source)</h3>`;
    const wrap = document.createElement('div');
    wrap.className = 'threads';
    for (const t of orphanRoots) wrap.innerHTML += renderThread(t);
    sec.appendChild(wrap);
    frag.appendChild(sec);
  }

  container.replaceChildren(frag);
  if (window.scrollY !== scrollY) window.scrollTo(0, scrollY);

  // ── Render the global-chat sidebar ──────────────────────────────────────
  renderSidebar(threads);

  // ── Render any ```mermaid``` diagrams in content + sidebar ──────────────
  // Fire-and-forget — mermaid.render is async; the rest of the render path
  // doesn't depend on diagrams being painted.
  renderMermaidIn(document.getElementById('content'));
  renderMermaidIn(document.getElementById('sidebar-threads'));

  // ── Read-receipt state promotion ─────────────────────────────────────────
  // Comments already known-read at the last render get .read added BEFORE
  // paint (no animation — they should appear settled). Newly-read ones get
  // it added on the next animation frame so the CSS transition fires.
  const toAnimate = [];
  document.querySelectorAll('.read-receipt[data-read="1"]').forEach(el => {
    const cid = el.getAttribute('data-cid');
    if (lastRenderedReadState.get(cid) === true) {
      el.classList.add('read');                 // synchronous; no transition
    } else {
      toAnimate.push(el);                       // deferred; transition kicks in
    }
  });
  if (toAnimate.length) {
    requestAnimationFrame(() => {
      // Two RAFs to be safe — first ensures initial styles painted, second
      // applies the .read class so the transition has somewhere to go from.
      requestAnimationFrame(() => {
        for (const el of toAnimate) el.classList.add('read');
      });
    });
  }
  // Update cache for next render.
  for (const c of state.comments) {
    lastRenderedReadState.set(c.id, (c.readBy || []).length > 0);
  }

  // Auto-focus ONLY a composer the user explicitly opened.
  //
  // Active threads always render a reply composer at the bottom (it's a
  // standing affordance). If we auto-focused any composer we found, that
  // textarea would grab focus on every render — silently swallowing 'n',
  // 'j', arrow keys, etc. and breaking keyboard navigation entirely.
  //
  // Only focus when state explicitly says the user opened something:
  //   - newComposerBlock set ⇒ a "new thread" composer is the active one
  //   - replyComposerRoot set ⇒ a reply composer (e.g. for a settled thread
  //     the user is reopening) is the active one
  let toFocus = null;
  if (state.newComposerBlock !== null) {
    toFocus = document.querySelector(`.composer[data-composer-line="${state.newComposerBlock}"] textarea`);
  } else if (state.replyComposerRoot !== null) {
    toFocus = document.querySelector(`.thread[data-root="${state.replyComposerRoot}"] .composer textarea`);
  }
  if (toFocus) toFocus.focus({ preventScroll: true });
}

// ─── navigation between blocks ─────────────────────────────────────────────────
function focusedIndex() {
  if (state.focusedBlock === null) return -1;
  return state.blocks.findIndex(b => b.start === state.focusedBlock);
}

function moveFocus(delta) {
  if (!state.blocks.length) return;
  let idx = focusedIndex();
  if (idx < 0) {
    idx = delta > 0 ? 0 : state.blocks.length - 1;
  } else {
    idx = Math.max(0, Math.min(state.blocks.length - 1, idx + delta));
  }
  state.focusedBlock = state.blocks[idx].start;
  render();
  scrollFocusedIntoView();
}

function focusNext() {
  const idx = focusedIndex();
  if (idx >= 0 && idx + 1 < state.blocks.length) {
    state.focusedBlock = state.blocks[idx + 1].start;
  }
}

function scrollFocusedIntoView() {
  const el = document.querySelector(`.block[data-line="${state.focusedBlock}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/// Unified n/N rotation list: every active focus target on the page, in order.
/// Inline block-anchored threads come first (sorted by line), then sidebar
/// global threads (sorted by createdAt — matches what's already rendered).
function activeFocusTargets(threads) {
  const targets = [];
  const seenLines = new Set();
  for (const line of activeThreadLines(threads)) {
    if (seenLines.has(line)) continue;
    seenLines.add(line);
    targets.push({ kind: 'block', line });
  }
  for (const id of activeGlobalThreadIds(threads)) {
    targets.push({ kind: 'sidebar', id });
  }
  return targets;
}

function targetEquals(t, kind, key) {
  if (t.kind !== kind) return false;
  return t.kind === 'block' ? t.line === key : t.id === key;
}

function currentTarget() {
  if (state.focusedSidebarThread) return { kind: 'sidebar', id: state.focusedSidebarThread };
  if (state.focusedBlock !== null) return { kind: 'block', line: state.focusedBlock };
  return null;
}

function applyTarget(t) {
  if (t.kind === 'block') {
    state.focusedBlock = t.line;
    state.focusedSidebarThread = null;
  } else {
    state.focusedBlock = null;
    state.focusedSidebarThread = t.id;
  }
}

function nextActiveThread(direction) {
  const targets = activeFocusTargets(buildThreads());
  if (!targets.length) return;
  const cur = currentTarget();
  let idx = -1;
  if (cur) {
    idx = targets.findIndex(t => targetEquals(t, cur.kind, cur.kind === 'block' ? cur.line : cur.id));
  }
  let nextIdx;
  if (idx === -1) {
    nextIdx = direction > 0 ? 0 : targets.length - 1;
  } else {
    nextIdx = (idx + direction + targets.length) % targets.length;
  }
  applyTarget(targets[nextIdx]);
  render();
  if (targets[nextIdx].kind === 'block') {
    scrollFocusedIntoView();
    pulseBlock(targets[nextIdx].line);
  } else {
    scrollSidebarThreadIntoView(targets[nextIdx].id);
    pulseSidebarThread(targets[nextIdx].id);
  }
}

function scrollSidebarThreadIntoView(rootId) {
  const el = document.querySelector(`#sidebar-threads .thread[data-root="${rootId}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function pulseSidebarThread(rootId) {
  const el = document.querySelector(`#sidebar-threads .thread[data-root="${rootId}"]`);
  if (!el) return;
  el.classList.remove('pulse-thread');
  void el.offsetWidth;
  el.classList.add('pulse-thread');
  setTimeout(() => el.classList.remove('pulse-thread'), 700);
}

function pulseBlock(line) {
  const el = document.querySelector(`.block[data-line="${line}"]`);
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 700);
}

// ─── click handling ────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.getAttribute('data-action');
  e.stopPropagation();

  if (action === 'open-new') {
    const line = parseInt(t.getAttribute('data-line'), 10);
    state.newComposerBlock = line;
    state.replyComposerRoot = null;
    render();
    return;
  }
  if (action === 'cancel') {
    state.newComposerBlock = null;
    state.replyComposerRoot = null;
    render();
    return;
  }
  if (action === 'submit-new') {
    const composer = t.closest('.composer');
    const body = (composer.querySelector('textarea').value || '').trim();
    if (!body) return;
    const line = parseInt(t.getAttribute('data-line'), 10);
    const text = t.getAttribute('data-text') || '';
    postSwift({ type: 'addComment', line, text, body });
    state.newComposerBlock = null;
    focusNext();
    scrollFocusedIntoView();
    return;
  }
  if (action === 'submit-reply') {
    const composer = t.closest('.composer');
    const body = (composer.querySelector('textarea').value || '').trim();
    if (!body) return;
    const root = t.getAttribute('data-root');
    postSwift({ type: 'addComment', replyTo: root, body });
    state.replyComposerRoot = null;
    return;
  }
  if (action === 'resolve-thread') {
    const root = t.getAttribute('data-root');
    postSwift({ type: 'resolveThread', id: root });
    return;
  }
  if (action === 'reopen-thread') {
    const root = t.getAttribute('data-root');
    postSwift({ type: 'reopenThread', id: root });
    return;
  }
  if (action === 'toggle-thread') {
    const root = t.getAttribute('data-root');
    if (state.expandedSettled.has(root)) state.expandedSettled.delete(root);
    else state.expandedSettled.add(root);
    render();
    return;
  }
  if (action === 'delete-comment') {
    const id = t.getAttribute('data-id');
    postSwift({ type: 'deleteComment', id });
    return;
  }
});

// ─── keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Overlay takes priority for Esc — close it and swallow the event.
  if (state.overlay && e.key === 'Escape') {
    hideOverlay();
    e.preventDefault();
    return;
  }

  const inTextarea = e.target && e.target.tagName === 'TEXTAREA';
  const inComposerTextarea = inTextarea && e.target.closest('.composer');

  // Inside a composer textarea (whether state-machine-driven or an always-on
  // bottom-of-thread reply box): handle submit / cancel.
  if (inComposerTextarea) {
    const isCmdEnter = (e.metaKey || e.ctrlKey) && e.key === 'Enter';
    const isTabSubmit = e.key === 'Tab' && !e.shiftKey;
    if (isCmdEnter || isTabSubmit) {
      const composer = e.target.closest('.composer');
      const btn = composer && composer.querySelector('.primary');
      if (btn) { btn.click(); e.preventDefault(); }
      return;
    }
    if (e.key === 'Escape') {
      state.newComposerBlock = null;
      state.replyComposerRoot = null;
      e.target.blur();
      render();
      e.preventDefault();
      return;
    }
    return;
  }

  if (inTextarea) return;

  if (e.key === 'ArrowDown' || e.key === 'j') {
    moveFocus(1); e.preventDefault();
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    moveFocus(-1); e.preventDefault();
  } else if (e.key === 'Enter' && state.focusedBlock !== null) {
    // Decide: if focused block has an active thread → open reply on the
    // most recent one. Otherwise → open new-thread composer.
    const blockThreads = threadsForBlock(state.focusedBlock, buildThreads())
      .filter(t => !t.root.resolved);
    if (blockThreads.length) {
      state.replyComposerRoot = blockThreads[blockThreads.length - 1].root.id;
      state.newComposerBlock = null;
    } else {
      state.newComposerBlock = state.focusedBlock;
      state.replyComposerRoot = null;
    }
    render();
    e.preventDefault();
  } else if (e.key === 'n' && !e.shiftKey) {
    nextActiveThread(1); e.preventDefault();
  } else if (e.key === 'N' || (e.key === 'n' && e.shiftKey)) {
    nextActiveThread(-1); e.preventDefault();
  } else if (e.key === 'ArrowRight' || e.key === 'l') {
    // Next file (no modifier; outside any textarea/composer)
    postSwift({ type: 'nextFile' });
    e.preventDefault();
  } else if (e.key === 'ArrowLeft' || e.key === 'h') {
    postSwift({ type: 'prevFile' });
    e.preventDefault();
  }
});

// ─── Swift bridge ──────────────────────────────────────────────────────────────
// ─── Sidebar rendering (scope=global) ─────────────────────────────────────
function renderSidebar(threads) {
  const wrap = document.getElementById('sidebar-threads');
  if (!wrap) return;
  const items = globalThreads(threads);
  const summary = document.getElementById('sidebar-summary');
  if (summary) {
    const active = items.filter(t => !t.root.resolved).length;
    summary.textContent = items.length === 0 ? '0 messages' :
      `${items.length} thread${items.length === 1 ? '' : 's'} · ${active} active`;
  }
  if (items.length === 0) {
    wrap.innerHTML = `<div class="sidebar-empty">No messages yet. Use this for whole-document comments — start a thread with the composer below.</div>`;
    return;
  }
  wrap.innerHTML = items.map(t => renderThread(t)).join('');
}

// ─── Cross-link overlay ──────────────────────────────────────────────────
function ghSlug(text) {
  return (text || '').toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

function extractSection(source, fragment) {
  if (!fragment) return source;
  const lines = source.split('\n');
  const target = fragment.toLowerCase();
  let startIdx = -1, level = -1;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(#{1,6})\s+(.+?)\s*$/);
    if (!m) continue;
    const text = m[2];
    if (ghSlug(text) === target || text.toLowerCase().includes(target)) {
      startIdx = i; level = m[1].length;
      break;
    }
  }
  if (startIdx === -1) return null;
  let endIdx = lines.length;
  for (let i = startIdx + 1; i < lines.length; i++) {
    const m = lines[i].match(/^(#{1,6})\s+/);
    if (m && m[1].length <= level) { endIdx = i; break; }
  }
  return lines.slice(startIdx, endIdx).join('\n');
}

function showOverlay(payload) {
  const { path, fragment, source } = payload;
  state.overlay = { path, fragment };
  const sliced = fragment ? extractSection(source, fragment) : source;
  let bodyHtml;
  if (sliced == null) {
    bodyHtml = `<div class="overlay-empty">Anchor <code>#${escapeHtml(fragment)}</code> not found — showing full file.</div>`
             + ((window.marked && marked.parse) ? marked.parse(source || '') : escapeHtml(source || ''));
  } else {
    bodyHtml = (window.marked && marked.parse) ? marked.parse(sliced) : escapeHtml(sliced);
  }
  document.getElementById('overlay-body').innerHTML = bodyHtml;
  document.getElementById('overlay-path').textContent = path + (fragment ? '  ›  #' + fragment : '');
  const ov = document.getElementById('overlay');
  ov.classList.add('visible');
  ov.setAttribute('aria-hidden', 'false');
  document.getElementById('overlay-body').scrollTop = 0;
  // Render mermaid diagrams inside the linked-document overlay too.
  renderMermaidIn(document.getElementById('overlay-body'));
}

function showOverlayError(payload) {
  const { path, fragment, reason } = payload;
  state.overlay = { path, fragment };
  document.getElementById('overlay-body').innerHTML =
    `<p>Could not open <code>${escapeHtml(path)}</code>:</p><pre>${escapeHtml(reason)}</pre>`;
  document.getElementById('overlay-path').textContent = path;
  document.getElementById('overlay').classList.add('visible');
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  ov.classList.remove('visible');
  ov.setAttribute('aria-hidden', 'true');
  state.overlay = null;
}

// ─── Link interceptor + overlay buttons + submit-global ──────────────────
// Intercept clicks on absolute file links (in main content, threads, or
// sidebar) and pop the overlay instead of navigating away.
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href]');
  if (a) {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('/') || href.startsWith('file:')) {
      e.preventDefault();
      e.stopPropagation();
      let raw = href.startsWith('file://') ? href.slice('file://'.length) : href;
      const hashIdx = raw.indexOf('#');
      const path = hashIdx >= 0 ? raw.slice(0, hashIdx) : raw;
      const fragment = hashIdx >= 0 ? raw.slice(hashIdx + 1) : '';
      postSwift({ type: 'fetchSection', path: decodeURIComponent(path), fragment: decodeURIComponent(fragment) });
      return;
    }
  }
  const t = e.target.closest && e.target.closest('[data-action]');
  if (!t) return;
  const action = t.getAttribute('data-action');
  if (action === 'overlay-close')           { hideOverlay(); return; }
  if (action === 'overlay-open-in-review')  {
    if (state.overlay && state.overlay.path) {
      postSwift({ type: 'openInSession', path: state.overlay.path });
    }
    hideOverlay(); return;
  }
  if (action === 'submit-global') {
    const composer = t.closest('.composer');
    const ta = composer.querySelector('textarea');
    const body = (ta.value || '').trim();
    if (!body) return;
    postSwift({ type: 'addGlobal', body });
    ta.value = '';
    return;
  }
});

window.hr = {
  applyState(payload) {
    state.blocks = splitBlocks(payload.source || '');
    state.comments = payload.comments || [];
    render();
    // On first render of this file, if there are unresolved threads, jump
    // straight to the first one — saves the user a scroll-and-hunt step.
    if (!state.initialJumpDone) {
      const actives = activeThreadLines(buildThreads());
      if (actives.length) {
        state.focusedBlock = actives[0];
        state.initialJumpDone = true;
        render();
        scrollFocusedIntoView();
        pulseBlock(actives[0]);
      } else {
        state.initialJumpDone = true;
      }
    }
  },
  showOverlay,
  showOverlayError,
};

postSwift({ type: 'ready' });
</script>
</body>
</html>
